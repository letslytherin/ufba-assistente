<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UFBA Assistente — Preparação</title>
<meta name="theme-color" content="#2f5d8a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
:root{
  --bg:#ffffff;--bg-subtle:#f5f7f9;--surface:#ffffff;--surface-hover:#eef2f6;--border:#e3e8ee;--border-strong:#cfd7e0;
  --text:#1c2733;--text-2:#56636f;--muted:#8793a0;--on-accent:#fff;
  --accent:#2f5d8a;--accent-hover:#264d73;--accent-soft:#e8f0f8;--accent-soft-border:#cddcec;
  --gradient:linear-gradient(135deg,#2f5d8a,#5b8bb8);--shadow-accent:0 6px 16px rgba(47,93,138,.28);
  --danger:#b3413e;--danger-soft:#f7e9e8;--warning:#b8791b;--warning-soft:#faf1e1;--success:#3f7a5c;--success-soft:#e9f3ee;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(28,39,51,.06);--shadow-md:0 4px 12px rgba(28,39,51,.08);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --c-lp:#2f5d8a;--c-inf:#7a5aa6;--c-ap:#b8791b;--c-ce:#3f7a5c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d;--bg-subtle:#171e25;--surface:#1b232b;--surface-hover:#232d37;--border:#2a3540;--border-strong:#3a4652;
  --text:#e6ebf0;--text-2:#a9b4bf;--muted:#7b8793;--accent:#6fa3d6;--accent-hover:#8ab6e0;--accent-soft:#1d2b3a;--accent-soft-border:#2c4259;
  --gradient:linear-gradient(135deg,#3b6c9c,#6fa3d6);--danger:#e07b77;--danger-soft:#3a2221;--warning:#e0a54a;--warning-soft:#382c17;--success:#6fbf92;--success-soft:#1c3226;
  --c-lp:#6fa3d6;--c-inf:#b194d8;--c-ap:#e0a54a;--c-ce:#6fbf92;
}}
:root[data-theme="dark"]{
  --bg:#12171d;--bg-subtle:#171e25;--surface:#1b232b;--surface-hover:#232d37;--border:#2a3540;--border-strong:#3a4652;
  --text:#e6ebf0;--text-2:#a9b4bf;--muted:#7b8793;--accent:#6fa3d6;--accent-hover:#8ab6e0;--accent-soft:#1d2b3a;--accent-soft-border:#2c4259;
  --gradient:linear-gradient(135deg,#3b6c9c,#6fa3d6);--danger:#e07b77;--danger-soft:#3a2221;--warning:#e0a54a;--warning-soft:#382c17;--success:#6fbf92;--success-soft:#1c3226;
  --c-lp:#6fa3d6;--c-inf:#b194d8;--c-ap:#e0a54a;--c-ce:#6fbf92;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-subtle);color:var(--text);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:inherit}
h1{font-size:1.75rem;line-height:1.25;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 8px}
h3{font-size:1.05rem;margin:28px 0 12px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:1.05rem}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--gradient);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:var(--shadow-accent)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.nav-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:14px 10px 6px}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text-2);text-decoration:none;font-size:.9rem;font-weight:500;border:0;background:none;width:100%;cursor:pointer;text-align:left}
.nav-link:hover{background:var(--surface-hover);color:var(--text)}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-link .ic{width:20px;text-align:center;font-size:15px}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
.side-count{margin:0 4px 6px;padding:12px;border-radius:var(--radius-md);background:var(--gradient);color:#fff}
.side-count b{font-size:1.6rem;display:block;line-height:1.1}
.side-count span{font-size:.78rem;opacity:.9}
.topbar{display:none}
.main{padding:32px 32px 96px;min-width:0}
.container{max-width:1040px;margin:0 auto}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.desc{color:var(--text-2);margin:0 0 20px;max-width:720px}
.page-header{margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px}
.stat .v{font-size:1.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--text-2);margin-top:4px}
.hero{background:var(--gradient);color:#fff;border-radius:var(--radius-lg);padding:24px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;box-shadow:var(--shadow-accent)}
.hero .big{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero .sub{opacity:.92;font-size:.92rem}
.hero .units{display:flex;gap:18px}
.hero .units div{text-align:center}
.hero .units b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.hero .units span{font-size:.72rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--radius-sm);padding:9px 16px;font-weight:600;font-size:.9rem;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-ghost{background:none;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-hover)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-soft-border)}
.pill-ok{background:var(--success-soft);color:var(--success);border-color:transparent}
.pill-warn{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.pill-bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill-muted{background:var(--bg-subtle);color:var(--muted);border-color:var(--border)}
.notice{border-radius:var(--radius-md);padding:12px 16px;font-size:.88rem;margin-bottom:18px;background:var(--warning-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warning) 30%,transparent)}
.notice b{color:var(--warning)}
.bar{height:8px;border-radius:99px;background:var(--bg-subtle);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.topic{cursor:default}
.topic label{flex:1;cursor:pointer}
.chk{width:18px;height:18px;accent-color:var(--accent);flex:none}
.area-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
details.disc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden}
details.disc>summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:14px}
details.disc>summary::-webkit-details-marker{display:none}
details.disc .body{padding:0 20px 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.82rem;font-weight:600;color:var(--text-2)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.q-enun{font-size:1.02rem;margin:6px 0 16px;white-space:pre-line}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font-size:.95rem}
.alt:hover{background:var(--surface-hover)}
.alt .letra{font-weight:700;color:var(--accent);flex:none;width:18px}
.alt.sel{border-color:var(--accent);background:var(--accent-soft)}
.alt.ok{border-color:var(--success);background:var(--success-soft)}
.alt.bad{border-color:var(--danger);background:var(--danger-soft)}
.alt[disabled]{cursor:default}
.expl{margin-top:12px;padding:12px 16px;border-radius:var(--radius-md);background:var(--bg-subtle);border-left:3px solid var(--accent);font-size:.92rem}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.15rem;cursor:pointer;padding:28px}
.flash .lado{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 0 18px 28px}
.timeline li:before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:2px;background:var(--border)}
.timeline li:last-child:before{display:none}
.timeline li:after{content:"";position:absolute;left:1px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong)}
.timeline li.passado:after{background:var(--muted);border-color:var(--muted)}
.timeline li.proximo:after{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.timeline li.prova:after{background:var(--danger);border-color:var(--danger)}
.timeline .d{font-size:.8rem;font-weight:700;color:var(--text-2)}
.timeline li.passado .t{color:var(--muted);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.timer{font-size:4.5rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:10px 0}
.plan-item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border)}
.plan-item:last-child{border-bottom:0}
.plan-item .min{flex:none;width:64px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.heat .cell{border-radius:var(--radius-md);padding:12px 14px;border:1px solid var(--border);font-size:.85rem}
.heat .cell b{display:block;font-size:.88rem;margin-bottom:4px}
.c-red{background:var(--danger-soft)}.c-yel{background:var(--warning-soft)}.c-grn{background:var(--success-soft)}.c-none{background:var(--bg-subtle)}
.redacao-area{font-family:"Courier New",monospace;line-height:28px;min-height:560px;background-image:repeating-linear-gradient(var(--surface),var(--surface) 27px,var(--border) 28px);background-attachment:local;padding-top:4px}
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty h2{color:var(--text)}
.bottom-nav{display:none}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:var(--surface);padding:8px}
.overlay{display:none}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.chart-bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.chart-bars .b i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent)}
.chart-bars .b span{font-size:.68rem;color:var(--muted);white-space:nowrap}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:50;width:280px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-md)}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .topbar .t{display:flex;align-items:center;gap:8px;font-weight:700}
  .icon-btn{border:0;background:none;font-size:20px;color:var(--text);cursor:pointer;padding:6px 8px;border-radius:8px}
  .main{padding:20px 16px 96px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--text-2);text-decoration:none;padding:4px}
  .bottom-nav a .ic{font-size:18px}
  .bottom-nav a.active{color:var(--accent);font-weight:600}
  .hero .big{font-size:2.8rem}
  .timer{font-size:3.4rem}
}
@media (max-width:420px){.g3,.g4{grid-template-columns:1fr 1fr}.hero .units{gap:12px}}
</style>
</head>

<div class="app" id="app">
  <div class="overlay" id="overlay"></div>

</div>

<script>
"use strict";
/* =========================================================================
   DADOS DO EDITAL (Edital de Abertura nº 007/2026 – UFBA / Instituto Avalia)
   ========================================================================= */
const EDITAL = {
  cargo: "201 – Assistente em Administração",
  classe: "Nível Médio – Classe D",
  vagas: { total: 94, ac: 55, pp: 24, pcd: 10, ind: 3, quil: 2 },
  redacaoCorrigida: { ac: 338, pp: 141, pcd: 57, ind: 17, quil: 11 },
  vencimento: 3181.39, auxAlimentacao: 1192.0, taxa: 100,
  banca: "Instituto Avalia", turno: "Manhã", duracao: "4 horas (objetiva + redação)",
  cidades: "Salvador, Vitória da Conquista, Barreiras, Teixeira de Freitas e Juazeiro",
  dataProva: "2026-12-20",
};
const AREAS = [
  { id: "lp",  nome: "Língua Portuguesa",         q: 12, peso: 1, cor: "var(--c-lp)" },
  { id: "inf", nome: "Noções de Informática",     q: 6,  peso: 1, cor: "var(--c-inf)" },
  { id: "ap",  nome: "Administração Pública",     q: 12, peso: 1, cor: "var(--c-ap)" },
  { id: "ce",  nome: "Conhecimentos Específicos", q: 30, peso: 2, cor: "var(--c-ce)" },
];
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const TOTAL_OBJ = AREAS.reduce((s, a) => s + a.q * a.peso, 0); // 90

const DATAS = [
  { ini: "2026-09-28", fim: "2026-09-28", t: "Publicação do Edital de Abertura" },
  { ini: "2026-09-28", fim: "2026-10-02", t: "Impugnação do edital" },
  { ini: "2026-09-28", fim: "2026-10-05", t: "Pedido de isenção da taxa (até 23h59)" },
  { ini: "2026-09-28", fim: "2026-10-06", t: "Upload dos documentos da isenção (até 23h59)" },
  { ini: "2026-10-09", fim: "2026-10-09", t: "Resultado dos pedidos de isenção" },
  { ini: "2026-10-12", fim: "2026-10-13", t: "Recurso contra indeferimento da isenção" },
  { ini: "2026-10-19", fim: "2026-10-19", t: "Resultado da isenção pós-recurso" },
  { ini: "2026-09-28", fim: "2026-10-29", t: "Inscrições (até 23h59 de 29/10)" },
  { ini: "2026-09-28", fim: "2026-10-30", t: "Pagamento da taxa (até 23h) e upload de laudo/documentos de reserva de vagas (até 23h59)" },
  { ini: "2026-11-06", fim: "2026-11-06", t: "Deferimento das inscrições" },
  { ini: "2026-11-09", fim: "2026-11-10", t: "Recurso contra indeferimento da inscrição" },
  { ini: "2026-11-17", fim: "2026-11-17", t: "Deferimento das inscrições pós-recurso" },
  { ini: "2026-12-11", fim: "2026-12-11", t: "Divulgação do horário e local de prova" },
  { ini: "2026-12-20", fim: "2026-12-20", t: "PROVA OBJETIVA + REDAÇÃO (manhã)", prova: true },
  { ini: "2026-12-21", fim: "2026-12-21", t: "Gabarito preliminar e caderno de questões" },
  { ini: "2026-12-22", fim: "2026-12-23", t: "Recurso contra o gabarito preliminar" },
  { ini: "2027-01-12", fim: "2027-01-12", t: "Gabarito pós-recursos e resultado preliminar da objetiva" },
  { ini: "2027-01-13", fim: "2027-01-14", t: "Recurso contra o resultado da objetiva" },
  { ini: "2027-01-20", fim: "2027-01-20", t: "Resultado da objetiva pós-recursos e gabarito definitivo" },
  { ini: "2027-01-29", fim: "2027-01-29", t: "Convocação: heteroidentificação (cotas negros/indígenas) e avaliação multiprofissional (PcD)" },
  { ini: "2027-02-13", fim: "2027-02-14", t: "Heteroidentificação presencial e análise documental (13–14/02); avaliação multiprofissional (14/02)" },
  { ini: "2027-02-24", fim: "2027-02-24", t: "Divulgação dos habilitados para correção da redação" },
  { ini: "2027-03-10", fim: "2027-03-10", t: "Resultado preliminar da redação" },
  { ini: "2027-03-11", fim: "2027-03-12", t: "Recurso contra o resultado da redação" },
  { ini: "2027-03-23", fim: "2027-03-23", t: "Resultado da redação pós-recurso" },
  { ini: "2027-04-23", fim: "2027-04-23", t: "Resultado preliminar e classificação" },
  { ini: "2027-04-26", fim: "2027-04-27", t: "Recurso contra o resultado e a classificação" },
  { ini: "2027-05-03", fim: "2027-05-03", t: "Resultado final e HOMOLOGAÇÃO" },
];

const KEY = "ufba-assistente:v1";
const hoje = () => isoDate(new Date());
function isoDate(d){ const z = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function parseIso(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDias(iso, n){ const d = parseIso(iso); d.setDate(d.getDate()+n); return isoDate(d); }
function diasEntre(a, b){ return Math.round((parseIso(b) - parseIso(a)) / 86400000); }
function fmtData(iso, opts={day:"2-digit",month:"2-digit"}){ return parseIso(iso).toLocaleDateString("pt-BR", opts); }

function estadoInicial(){
  const topicos = {};
  for (const a of AREAS) topicos[a.id] = TOPICOS_PADRAO[a.id].map((nome,i) => ({ id: a.id+"-"+i, nome, estudado:false, revisoes:0, ultima:null }));
  return {
    dataProva: EDITAL.dataProva, horasDia: 2, diasSemana: 6, meta: 60,
    topicos, respostas: [], erros: {}, flash: {}, sessoes: [], simulados: [], redacoes: [],
    qExtras: [], fcExtras: [], checklist: {},
  };
}
let S;
try { S = Object.assign(estadoInicial(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { S = estadoInicial(); }
function salvar(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

const todasQuestoes = () => [...Q_SEED.map((q,i)=>({...q,id:"s"+i})), ...S.qExtras];
const todosFlash = () => [...FC_SEED.map((f,i)=>({a:f[0],f:f[1],v:f[2],id:"f"+i})), ...S.fcExtras];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Repetição espaçada simples (caixas de Leitner) */
const INTERVALOS = [1, 3, 7, 15, 30, 60];
function agendar(item, acertou){
  item.caixa = acertou ? Math.min((item.caixa||0)+1, INTERVALOS.length-1) : 0;
  item.proxima = addDias(hoje(), acertou ? INTERVALOS[item.caixa] : 1);
}

   ========================================================================= */
function diasParaProva(){ return diasEntre(hoje(), S.dataProva); }
function statsArea(){
  const out = {};
  for (const a of AREAS){
    const tps = S.topicos[a.id] || [];
    const rs = S.respostas.filter(r => r.a === a.id);
    const ac = rs.filter(r => r.ok).length;
    out[a.id] = { total: tps.length, estudados: tps.filter(t=>t.estudado).length, resp: rs.length, acertos: ac, taxa: rs.length ? ac/rs.length : null };
  }
  return out;
}
function statsTopico(area, nome){
  const rs = S.respostas.filter(r => r.a === area && r.t === nome);
  return { n: rs.length, taxa: rs.length ? rs.filter(r=>r.ok).length/rs.length : null };
}
function indiceProntidao(){
  const st = statsArea(); let soma = 0;
  for (const a of AREAS){
    const s = st[a.id]; const peso = a.q*a.peso/TOTAL_OBJ;
    const cob = s.total ? s.estudados/s.total : 0;
    const des = s.taxa == null ? 0 : s.taxa;
    soma += peso * (0.5*cob + 0.5*des);
  }
  return Math.round(soma*100);
}
function constancia(){
  const dias = new Set([...S.sessoes.map(s=>s.data), ...S.respostas.map(r=>r.data)]);
  let streak = 0; let d = hoje();
  if (!dias.has(d)) d = addDias(d,-1);
  while (dias.has(d)){ streak++; d = addDias(d,-1); }
  return { streak, dias };
}
function minutosPorDia(n=14){
  const out = [];
  for (let i=n-1;i>=0;i--){ const d = addDias(hoje(),-i); out.push({ d, m: S.sessoes.filter(s=>s.data===d).reduce((x,s)=>x+s.min,0) }); }
  return out;
}
function errosVencidos(){ return Object.entries(S.erros).filter(([,e]) => e.proxima <= hoje()); }
function flashVencidos(){ return todosFlash().filter(f => { const s = S.flash[f.id]; return !s || s.proxima <= hoje(); }); }
function proximoEvento(){ return DATAS.filter(d => d.fim >= hoje()).sort((a,b)=>a.fim.localeCompare(b.fim))[0]; }

  const lista = [];
  for (const a of AREAS){
    const tps = S.topicos[a.id]; const pesoTop = (a.q*a.peso)/Math.max(1,tps.length);
    for (const t of tps){
      const s = statsTopico(a.id, t.nome);
      const fraqueza = s.taxa == null ? 0.6 : 1 - s.taxa;
      const naoEst = t.estudado ? 0.35 : 1;
      lista.push({ area:a.id, t, score: pesoTop * (0.5*naoEst + 0.5*fraqueza), taxa:s.taxa });
    }
  }
  return lista.sort((x,y)=>y.score-x.score);
}
function gerarPlano(min){
  const itens = []; let resto = min;
  const ev = errosVencidos().length, fv = flashVencidos().length;
  const tetoRev = Math.round(min*0.35);
  if (fv){ const m = Math.min(tetoRev, Math.max(5, Math.ceil(fv*0.75))); itens.push({min:m, tit:`Revisar ${fv} flashcards vencidos`, link:"#/flashcards", tipo:"Revisão"}); resto -= m; }
  if (ev && resto > 10){ const m = Math.min(Math.max(5, tetoRev - (itens[0]?.min||0)), ev*3); if (m>0){ itens.push({min:m, tit:`Refazer ${ev} questões erradas`, link:"#/erros", tipo:"Revisão"}); resto -= m; } }
  const prio = prioridadeTopicos();
  let i = 0;
  while (resto >= 15 && i < prio.length){
    const p = prio[i++];
    const bloco = Math.min(resto, p.t.estudado ? 30 : 50);
    if (bloco < 15) break;
    const teoria = Math.round(bloco*0.6), quest = bloco - teoria;
    itens.push({min:teoria, tit:`${p.t.estudado?"Revisar":"Estudar"}: ${p.t.nome}`, sub:AREA[p.area].nome + (p.taxa!=null?` · acerto atual ${pct(p.taxa)}`:""), tipo:"Teoria", link:"#/edital"});
    itens.push({min:quest, tit:`Questões: ${p.t.nome}`, sub:`~${Math.max(3,Math.round(quest/2.5))} questões (QConcursos / banco do app)`, tipo:"Questões", link:`#/questoes?a=${p.area}`});
    resto -= bloco;
  }
  if (resto >= 5) itens.push({min:resto, tit:"Redação ou leitura de lei seca", sub:"Alterne: 1 redação por semana (20–30 linhas, dissertativo)", tipo:"Extra", link:"#/redacao"});
  return itens;
}
function renderPlano(itens){
  const total = itens.reduce((s,i)=>s+i.min,0);
  return `<div class="card"><div class="row between"><h2>Agenda de hoje</h2><span class="pill">${total} min</span></div>
    ${itens.map(i=>`<div class="plan-item"><div class="min">${i.min} min</div><div style="flex:1"><div class="small muted">${i.tipo}</div><div style="font-weight:600">${esc(i.tit)}</div>${i.sub?`<div class="small muted">${esc(i.sub)}</div>`:""}</div><a class="btn btn-sm btn-ghost" href="${i.link}">Abrir →</a></div>`).join("")}

}

function renderQuestao(q, onResp, opts={}){
  const wrap = document.createElement("div"); wrap.className = "card";
  wrap.innerHTML = `<div class="row between small"><span>${areaTag(q.a)}</span><span class="muted">${esc(q.t||"")}</span></div>
    <div class="q-enun">${esc(q.e)}</div>

  wrap.querySelectorAll(".alt").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i); const ok = i === q.c;
    if (opts.semFeedback){ wrap.querySelectorAll(".alt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); onResp(i, ok); return; }
    wrap.querySelectorAll(".alt").forEach(x => { x.disabled = true; const xi = Number(x.dataset.i); if (xi===q.c) x.classList.add("ok"); else if (xi===i) x.classList.add("bad"); });
    wrap.querySelector(".fb").innerHTML = `<div class="expl"><b>${ok?"✓ Correta":"✗ Incorreta — gabarito "+"ABCDE"[q.c]}.</b> ${esc(q.x||"")}</div>`;
    onResp(i, ok);
  });
  return wrap;
}
function registrarResposta(q, ok){
  S.respostas.push({ id:q.id, a:q.a, t:q.t, ok, data:hoje() });
  if (!ok){ S.erros[q.id] = S.erros[q.id] || { caixa:0, vezes:0, desde:hoje() }; S.erros[q.id].vezes++; agendar(S.erros[q.id], false); }
  else if (S.erros[q.id]) { agendar(S.erros[q.id], true); if (S.erros[q.id].caixa >= 3) delete S.erros[q.id]; }
  salvar();
}

function rodarSimulado(el, qs){
  const resp = {}; const t0 = Date.now(); const limite = Math.round(qs.length * 3.2 * 60);
  el.innerHTML = `<div class="container" style="max-width:780px"><div class="row between" style="position:sticky;top:0;background:var(--bg-subtle);padding:10px 0;z-index:5"><b>Simulado · ${qs.length} questões</b><span class="pill" id="st"></span></div><div id="sq"></div>
    <div class="btn-row"><button class="btn btn-primary" id="fim">Entregar e corrigir</button></div></div>`;
  const box = el.querySelector("#sq");
  qs.forEach((q,i) => { const h = document.createElement("div"); h.className="small muted"; h.style.margin="18px 0 6px"; h.textContent=`${i+1}.`; box.append(h, renderQuestao(q, (alt) => { resp[q.id] = alt; }, {semFeedback:true})); });
  const tick = setInterval(() => { const s = Math.round((Date.now()-t0)/1000); el.querySelector("#st").textContent = `⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} / ${Math.round(limite/60)} min`; }, 1000);
  limpar = () => clearInterval(tick);
  el.querySelector("#fim").onclick = () => {
    const semResp = qs.filter(q=>resp[q.id]==null).length;
    if (semResp && !confirm(`${semResp} questão(ões) sem resposta. Entregar mesmo assim?`)) return;
    clearInterval(tick);
    const porArea = Object.fromEntries(AREAS.map(a=>[a.id,{n:0,ok:0}]));
    qs.forEach(q => { const ok = resp[q.id] === q.c; porArea[q.a].n++; if (ok) porArea[q.a].ok++; if (resp[q.id]!=null) registrarResposta(q, ok); });
    const proj = AREAS.reduce((s,a)=>{ const p = porArea[a.id]; return s + (p.n ? p.ok/p.n : 0) * a.q * a.peso; }, 0);
    const zerou = AREAS.filter(a=>porArea[a.id].n && !porArea[a.id].ok);
    const acertos = qs.filter(q=>resp[q.id]===q.c).length;
    const min = Math.round((Date.now()-t0)/60000);
    S.simulados.push({data:hoje(), acertos, total:qs.length, proj, min}); S.sessoes.push({data:hoje(), min, a:"ce"}); salvar();
    el.innerHTML = `<div class="container" style="max-width:780px">${header("Simulado · Resultado", `${acertos}/${qs.length} acertos`)}
      <div class="grid g3"><div class="stat"><div class="v">${proj.toFixed(1)}</div><div class="l">nota projetada (0–90)</div></div><div class="stat"><div class="v">${min} min</div><div class="l">tempo usado</div></div>
      <div class="stat"><div class="v">${proj>=45&&!zerou.length?"✓":"✗"}</div><div class="l">${proj>=45&&!zerou.length?"acima do mínimo (45 pts)":zerou.length?"zerou: "+zerou.map(a=>a.nome).join(", "):"abaixo de 45 pts"}</div></div></div>
      <div class="card" style="margin-top:14px"><table><thead><tr><th>Área</th><th class="n">Acertos</th><th class="n">%</th><th class="n">Projeção</th></tr></thead><tbody>
      ${AREAS.map(a=>{const p=porArea[a.id];return `<tr><td>${areaTag(a.id)}</td><td class="n">${p.ok}/${p.n}</td><td class="n">${p.n?pct(p.ok/p.n):"—"}</td><td class="n">${(p.n?p.ok/p.n*a.q*a.peso:0).toFixed(1)} / ${a.q*a.peso}</td></tr>`}).join("")}</tbody></table></div>
      <h3>Gabarito comentado</h3>
      ${qs.map((q,i)=>`<div class="card"><div class="small muted">${i+1}. ${AREA[q.a].nome}</div><div class="q-enun" style="margin-bottom:8px">${esc(q.e)}</div>
        <div class="small">Sua resposta: <b style="color:${resp[q.id]===q.c?"var(--success)":"var(--danger)"}">${resp[q.id]!=null?"ABCDE"[resp[q.id]]:"—"}</b> · Gabarito: <b>${"ABCDE"[q.c]}) ${esc(q.o[q.c])}</b></div>${q.x?`<div class="expl">${esc(q.x)}</div>`:""}</div>`).join("")}
      <div class="btn-row"><a class="btn btn-primary" href="#/erros">Ir para Meus erros</a><a class="btn btn-secondary" href="#/desempenho">Ver desempenho</a></div></div>`;
  };
}

      <div class="card"><h2>A prova</h2><table><thead><tr><th>Área</th><th class="n">Questões</th><th class="n">Pts/q</th><th class="n">Total</th></tr></thead><tbody>
        ${AREAS.map(a=>`<tr><td>${a.nome}</td><td class="n">${a.q}</td><td class="n">${a.peso}</td><td class="n">${a.q*a.peso}</td></tr>`).join("")}
        <tr><td>Redação</td><td class="n">1</td><td class="n">—</td><td class="n">60</td></tr><tr><td><b>Total</b></td><td class="n"><b>60 + 1</b></td><td></td><td class="n"><b>150</b></td></tr></tbody></table>

    </div>

      <li>Suporte administrativo em administração, RH, finanças, patrimônio, materiais, compras, contratos, logística e atendimento</li>

ROTAS["/config"] = el => {
  el.innerHTML = `<div class="container" style="max-width:720px">
    ${header("Configurações","Configurações e backup","Seus dados ficam só neste navegador. Faça backup de vez em quando.")}
    <div class="card"><div class="grid g2">
      <div class="field"><label>Data da prova</label><input type="date" id="cd" value="${S.dataProva}"></div>
      <div class="field"><label>Horas de estudo por dia</label><input type="number" id="ch" min="0.5" max="12" step="0.5" value="${S.horasDia}"></div>
      <div class="field"><label>Dias de estudo por semana</label><input type="number" id="cs" min="1" max="7" value="${S.diasSemana}"></div></div>
      <button class="btn btn-primary" id="csave">Salvar</button> <span class="small muted" id="cmsg"></span></div>
    <div class="card"><h2>Backup</h2><div class="btn-row"><button class="btn btn-secondary" id="exp">Exportar (.json)</button><label class="btn btn-secondary">Importar<input type="file" id="imp" accept=".json" hidden></label><button class="btn btn-danger" id="reset">Apagar tudo</button></div></div></div>`;
  const $ = s => el.querySelector(s);
  $("#csave").onclick = () => { S.dataProva = $("#cd").value || EDITAL.dataProva; S.horasDia = Number($("#ch").value)||2; S.diasSemana = Math.min(7,Math.max(1,Number($("#cs").value)||6)); salvar(); pintarNav("/config"); $("#cmsg").textContent = "✓ Salvo"; };
  $("#exp").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); a.download = `ufba-assistente-backup-${hoje()}.json`; a.click(); };
  $("#imp").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { S = Object.assign(estadoInicial(), JSON.parse(t)); salvar(); alert("Backup importado."); rotear(); } catch { alert("Arquivo inválido."); } }); };
  $("#reset").onclick = () => { if (confirm("Apagar todo o progresso? Não dá para desfazer.")){ S = estadoInicial(); salvar(); rotear(); } };
};

rotear();
</script>
