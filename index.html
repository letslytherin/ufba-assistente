{a:"lp",t:"Regência verbal e nominal",e:"Assinale a alternativa em que o emprego de “onde” ou “aonde” está de acordo com a norma-padrão.",o:["Aonde fica a Pró-Reitoria de Desenvolvimento de Pessoas?","Onde você vai depois do expediente?","Aonde você vai depois do expediente?","Não sei aonde guardei o processo.","A sala aonde trabalho é pequena."],c:2,x:"“Aonde” = a + onde: só com verbos de movimento que pedem a preposição “a” (ir a). “Onde” indica lugar em que algo está (ficar, guardar, trabalhar)."},
{a:"lp",t:"Morfossintaxe: classes e formação de palavras, termos da oração",e:"A palavra “infelizmente” é formada por",o:["derivação parassintética","derivação prefixal e sufixal","composição por aglutinação","derivação regressiva","derivação imprópria"],c:1,x:"Existem “infeliz” (prefixo in-) e “felizmente” (sufixo -mente): os afixos podem ser retirados um de cada vez → prefixal e sufixal. Na parassintética, os dois entram juntos e obrigatoriamente (ex.: entristecer)."},
{a:"lp",t:"Coordenação, subordinação, vozes verbais e pronomes relativos",e:"No período “Chegou ao setor, ligou o computador, abriu o sistema e começou os atendimentos.”, as orações mantêm entre si relação de",o:["oposição","causa","adição","condição","finalidade"],c:2,x:"Orações coordenadas (assindéticas e a última sindética com “e”) em sequência de ações: relação de adição. A AOCP cobrou exatamente esse tipo de relação em trecho de crônica."},
{a:"lp",t:"Redação Oficial (Manual da Presidência, 3ª ed.)",e:"Para que as comunicações oficiais tenham uma única interpretação, o Manual de Redação recomenda o uso de linguagem",o:["conotativa, rica em figuras","denotativa, no sentido literal das palavras","informal, próxima da fala","técnica, com jargões de cada área","híbrida, alternando registros"],c:1,x:"Clareza e precisão exigem linguagem denotativa (sentido próprio), evitando ambiguidade, figuras e jargões."},
{a:"inf",t:"Planilhas eletrônicas (Excel)",e:"Relacione as teclas de atalho do LibreOffice Calc (instalação em português) às funções e assinale a sequência correta.\n1. Recortar  2. Localizar e substituir  3. Modo de edição da célula\n( ) Ctrl+H   ( ) F2   ( ) Ctrl+X",o:["1 – 2 – 3","2 – 3 – 1","3 – 1 – 2","2 – 1 – 3","3 – 2 – 1"],c:1,x:"No Calc: Ctrl+H = Localizar e substituir; F2 = editar a célula; Ctrl+X = recortar. A AOCP adora questões de “relacione as colunas” com atalhos."},
{a:"inf",t:"Ameaças: vírus, worms, malware, ransomware",e:"O programa malicioso que permite ao invasor retornar a um equipamento comprometido, por meio da inclusão ou modificação de serviços no sistema, é o",o:["worm","backdoor","adware","keylogger","bot"],c:1,x:"Backdoor = “porta dos fundos” para o retorno do invasor. Keylogger captura teclas; bot integra uma rede de máquinas “zumbis” (botnet)."},
{a:"ce",t:"Protocolo e avaliação de documentos",e:"O instrumento que organiza os documentos de arquivo segundo as funções e atividades do órgão, atribuindo códigos a cada assunto, é o",o:["tabela de temporalidade","plano (código) de classificação","inventário","listagem de eliminação","termo de recolhimento"],c:1,x:"O plano de classificação agrupa os documentos por função/atividade (com códigos numéricos). A tabela de temporalidade usa esses mesmos códigos para definir prazos e destinação."},
{a:"ce",t:"Gestão de pessoas: conceitos e função do órgão de GP",e:"Na gestão de cargos, a descrição de cargo focaliza",o:["os requisitos físicos e intelectuais exigidos do ocupante","o conteúdo do cargo: o que o ocupante faz, como faz e por que faz","o salário de mercado para a função","a avaliação de desempenho do ocupante","o plano de carreira da organização"],c:1,x:"Descrição = conteúdo do cargo (tarefas e atribuições). Análise = requisitos que o cargo impõe ao ocupante (instrução, experiência, responsabilidades, condições de trabalho)."},
{a:"ce",t:"Trabalho em equipe, relações interpessoais e comunicação",e:"Em uma negociação em que o montante a ser dividido é fixo e o ganho de uma parte representa a perda da outra, a abordagem de barganha é",o:["integrativa","distributiva","colaborativa","ganha-ganha","sinérgica"],c:1,x:"Barganha distributiva: recursos fixos, soma zero (ganha-perde). Integrativa: busca soluções que ampliem o ganho de ambos (ganha-ganha). Tema cobrado pela AOCP em 2023."},
{a:"ce",t:"Processo organizacional: planejamento, direção, comunicação, controle",e:"Segundo Katz, as habilidades que o administrador precisa desenvolver são",o:["interpessoais, informacionais e decisórias","técnicas, humanas e conceituais","planejar, organizar e controlar","estratégicas, táticas e operacionais","formais e informais"],c:1,x:"Katz: técnicas (mais importantes na base), humanas (em todos os níveis) e conceituais (mais importantes na cúpula). Não confunda com os papéis de Mintzberg."},
);

/* ---------- Resumos por tópico (chave = nome exato do tópico) ---------- */
const RESUMOS = {
"Crase":["Regra: preposição “a” + artigo “a(s)” (ou pronome “aquela”, “a qual”).","Obrigatória: locuções adverbiais femininas (às vezes, à noite), prepositivas (à frente de) e conjuntivas (à medida que); hora exata (às 8h); “à moda de” (arroz à grega).","Proibida: antes de masculino, verbo, pronomes pessoais e de tratamento (exceto senhora, senhorita, dona), artigo indefinido, entre palavras repetidas (cara a cara) e com “a” no singular antes de plural (a pessoas).","Facultativa: antes de possessivo feminino no singular (à/a sua sala), de nome próprio feminino e depois de “até”.","Truque: troque por uma palavra masculina — se virar “ao”, há crase."],
"Concordância verbal e nominal":["O verbo concorda com o núcleo do sujeito; sujeito composto anteposto → plural.","Impessoais (sempre no singular): haver = existir/tempo decorrido; fazer = tempo/clima. Contaminam o auxiliar: “Deve haver soluções”.","VTD + se (partícula apassivadora) → concorda: “Vendem-se casas”. VTI + se (índice de indeterminação) → singular: “Precisa-se de técnicos”.","Coletivo partitivo (a maioria de, parte de) + plural: verbo no singular ou no plural.","Nominal: anexo, obrigado, mesmo, incluso e quite concordam; “meio” advérbio é invariável (meio cansada); “é proibido entrada” × “é proibida a entrada” (com artigo, concorda)."],
"Regência verbal e nominal":["Assistir (ver) → a: assistiu ao filme. Assistir (ajudar) → TD: assistiu o paciente.","Aspirar (desejar) → a · Visar (almejar) → a · Visar (mirar, rubricar) → TD.","Obedecer/desobedecer → a · Preferir → a (sem “mais” nem “do que”) · Implicar (acarretar) → TD.","Chegar/ir → a (não “em”) · Pagar/perdoar: coisa TD, pessoa TI · Esquecer/lembrar: com “se” pedem “de”.","Onde (lugar em que) × aonde (lugar a que — verbos de movimento): “Aonde você vai?”"],
"Colocação pronominal":["Próclise (pronome antes): palavras negativas, advérbios sem vírgula, pronomes relativos, indefinidos e interrogativos, conjunções subordinativas.","Mesóclise: futuro do presente/pretérito sem atrator (far-se-á, dir-lhe-ia).","Ênclise: início de período, imperativo afirmativo, gerúndio (sem “em”), após pausa.","Nunca ênclise com particípio (“tinha-se dado”, e não “tinha dado-se”).","Na norma-padrão não se inicia período com pronome oblíquo átono."],
"Pontuação e efeitos de sentido":["Não se separam por vírgula sujeito e verbo, nem verbo e complemento.","Vírgula obrigatória: vocativo, aposto explicativo, orações adjetivas explicativas, expressões explicativas (isto é, ou seja), adjunto adverbial deslocado longo, elipse do verbo, conjunções adversativas (mas, porém).","“Pois” conclusivo e “porém/contudo” deslocados ficam entre vírgulas.","Oração adjetiva restritiva (sem vírgula) × explicativa (com vírgula): a vírgula muda o sentido.","A AOCP/Avalia pergunta se a vírgula é “opcional” ou se “altera o sentido”."],
"Coesão e coerência: referência, conectores, progressão":["Coesão referencial: anáfora retoma o que já foi dito; catáfora antecipa.","Mecanismos: pronomes, sinônimos, hiperônimos, elipse, repetição.","Adição: e, além disso · Oposição: mas, porém, contudo, todavia, no entanto · Concessão: embora, ainda que, apesar de.","Causa: porque, visto que, já que, porquanto · Conclusão: logo, portanto, por isso · Condição: se, caso · Finalidade: para que, a fim de que · Conformidade: conforme, segundo · Proporção: à medida que.","A banca pede a relação entre orações (adição, tempo, oposição…) e a troca de conectores sem mudar o sentido."],
"Coordenação, subordinação, vozes verbais e pronomes relativos":["Coordenadas: aditivas, adversativas, alternativas, conclusivas e explicativas.","Subordinadas: substantivas (funcionam como sujeito ou objeto…), adjetivas (restritivas/explicativas) e adverbiais (causais, concessivas, condicionais…).","Voz passiva analítica: ser + particípio (o tempo do “ser” = tempo do verbo da ativa). Sintética: VTD + se.","Relativos: que, quem (sempre com preposição), o qual, cujo (posse, sem artigo depois), onde (lugar físico).","Preposição exigida pelo verbo da oração adjetiva vai antes do relativo: “o cargo a que aspiro”."],
"Ortografia oficial e acentuação gráfica":["Oxítonas: acentuam-se as terminadas em a(s), e(s), o(s), em, ens (café, também).","Paroxítonas: acentuam-se as terminadas em l, n, r, x, ps, ã(s), ão(s), i(s), us, um, uns e ditongo (fácil, órfão, vírus).","Todas as proparoxítonas são acentuadas.","Acordo: caiu o acento dos ditongos abertos ei/oi em paroxítonas (ideia, heroico), dos hiatos oo/ee (voo, leem) e o trema.","Diferenciais mantidos: pôde/pode, pôr/por, têm/tem, vêm/vem. Hífen: vogal igual separa (micro-ondas); vogal diferente junta (autoestima); r/s dobram (antirrugas)."],
"Semântica: denotação, conotação, sinonímia, paronímia, figuras de linguagem":["Denotação = sentido literal; conotação = sentido figurado.","Parônimos (parecidos): retificar/ratificar, eminente/iminente, descrição/discrição, infringir/infligir, mandato/mandado, tráfego/tráfico.","Homônimos (iguais): sessão/seção/cessão, concerto/conserto, cela/sela.","Metáfora (comparação implícita) · Metonímia (autor pela obra, parte pelo todo) · Hipérbole (exagero) · Ironia · Antítese (ideias opostas).","Ambiguidade: frase com duplo sentido — a banca pede a reescrita que a desfaz."],
"Redação Oficial (Manual da Presidência, 3ª ed.)":["Atributos: clareza e precisão, objetividade, concisão, coesão e coerência, impessoalidade, formalidade e padronização, uso da norma-padrão.","Vossa Excelência: Presidente, Vice, ministros, parlamentares, magistrados, governadores, prefeitos etc. Vossa Magnificência: reitores (vocativo “Magnífico Reitor”). Vossa Senhoria: demais autoridades e particulares.","Pronomes de tratamento: verbo e possessivos na 3ª pessoa (Vossa Senhoria tem… seu). Aboliram-se “Digníssimo”, “Ilustríssimo” e “Doutor” como tratamento.","Fechos: “Respeitosamente” (autoridade superior) e “Atenciosamente” (mesma hierarquia ou inferior).","Padrão ofício (aviso, memorando e ofício unificados como “ofício”): cabeçalho, identificação (OFÍCIO Nº 12/2026/SIGLA), local e data, endereçamento, assunto, texto, fecho, assinatura. O e-mail é aceito como documento oficial."],
"Tipologia textual e gêneros textuais":["Tipos (modos de organização): narração (fatos no tempo, personagens), descrição (características), dissertação-argumentativa (tese + argumentos), exposição (informar/explicar), injunção (instruir: receitas, manuais).","Gêneros: crônica, notícia, artigo de opinião, editorial, ofício, e-mail, relatório, charge…","A AOCP/Avalia costuma usar crônica ou reportagem e perguntar o “modo de organização predominante”."],
"Variação linguística e adequação de registro":["Variação: regional (diatópica), social (diastrática), situacional (diafásica) e histórica (diacrônica).","Registro formal para documentos oficiais; informal para situações cotidianas.","Não existe “erro” na variação; existe inadequação ao contexto. Em documentos oficiais, vale a norma-padrão."],
"Reescrita de frases e equivalência de estruturas":["Verifique sempre: o sentido se manteve? A correção gramatical se manteve?","Trocas seguras: portanto ↔ logo ↔ por isso; mas ↔ porém ↔ contudo; embora + subjuntivo ↔ apesar de + infinitivo.","Voz ativa ↔ passiva: mantenha o tempo verbal.","Cuidado ao trocar preposições (“abraçado às pernas” não admite qualquer preposição)."],
"Compreensão e interpretação de textos":["Leia o comando antes do texto: “segundo o texto” pede o que está escrito; “infere-se” pede conclusão lógica.","Descarte alternativas com generalizações (sempre, nunca, todos) que o texto não sustenta.","Na AOCP/Avalia as ~10 questões de Português costumam estar TODAS ligadas a um único texto — gramática contextualizada."],
"Morfossintaxe: classes e formação de palavras, termos da oração":["10 classes: substantivo, adjetivo, artigo, numeral, pronome, verbo, advérbio, preposição, conjunção, interjeição.","Formação: derivação (prefixal, sufixal, parassintética, regressiva, imprópria) e composição (justaposição: girassol; aglutinação: planalto). “Ofegante” = ofegar + sufixo -nte (agente).","Termos essenciais: sujeito e predicado. Integrantes: objetos direto/indireto, complemento nominal, agente da passiva. Acessórios: adjunto adnominal, adjunto adverbial, aposto (e vocativo, à parte).","A AOCP pediu formação de palavras (sufixo -ículo, prefixo des-) direto no texto-base."],
"Organização de arquivos, diretórios e integridade de documentos":["Estrutura em árvore: unidade (C:) → pastas → subpastas → arquivos. Caminho: C:\\Users\\nome\\Documentos\\oficio.docx.","Extensões: .docx/.odt (texto), .xlsx/.ods (planilha), .pptx/.odp (apresentação), .pdf, .txt, .zip, .jpg/.png, .exe.","Nomes não podem conter \\ / : * ? \" < > |.","Integridade: backup, controle de versões, permissões de acesso, PDF para documentos finais, nomes padronizados (data_assunto_versão)."],
"Apresentações (PowerPoint)":["F5 inicia do primeiro slide; Shift+F5 do slide atual; Esc encerra.","Modos: Normal, Classificação de Slides, Anotações, Modo de Exibição de Leitura; Slide Mestre padroniza o layout.","Transição (entre slides) × Animação (objetos dentro do slide).","Ctrl+M novo slide (Office em inglês e português). Impress (LibreOffice) = equivalente livre."],
"Planilhas eletrônicas (Excel)":["Toda fórmula começa com =. Operadores: ^ depois * / depois + −; & concatena.","SOMA, MÉDIA, MÁXIMO, MÍNIMO; CONT.NÚM (números), CONT.VALORES (não vazias), CONTAR.VAZIO; CONT.SE e SOMASE com critério.","SE(teste;verdadeiro;falso) · PROCV(valor;matriz;coluna;0) · E/OU.","Referências: A1 relativa; $A$1 absoluta; $A1 fixa a coluna; A$1 fixa a linha. F4 alterna (Excel).","Erros: #DIV/0!, #N/D (não encontrado), #REF! (referência inválida), #NOME? (função errada), #VALOR! (tipo errado)."],
"Processador de textos (Word)":["Atalhos no Word em português: Ctrl+N negrito, Ctrl+I itálico, Ctrl+S sublinhado, Ctrl+B salvar, Ctrl+O novo, Ctrl+A abrir, Ctrl+P imprimir.","Ctrl+T selecionar tudo · Ctrl+L localizar · Ctrl+U substituir · Ctrl+K hiperlink · F7 ortografia · Ctrl+Enter quebra de página.","Alinhamento: Ctrl+Q esquerda, Ctrl+E centralizar, Ctrl+G direita, Ctrl+J justificar.","Guias: Página Inicial, Inserir, Design, Layout, Referências (sumário, notas), Correspondências (mala direta), Revisão (controlar alterações), Exibir."],
"Windows 10+: arquivos, pastas, programas e configurações":["Win+E Explorador · Win+D área de trabalho · Win+L bloquear · Win+R Executar · Win+I Configurações · Alt+Tab alterna janelas.","Ctrl+Shift+Esc Gerenciador de Tarefas · Win+V histórico da área de transferência · Win+Shift+S captura de tela.","F2 renomear · Delete manda para a Lixeira · Shift+Delete exclui definitivamente · Ctrl+Shift+N nova pasta.","Arrastar entre unidades diferentes copia; na mesma unidade, move (Ctrl força cópia; Shift força mover)."],
"Segurança da informação: senhas, autenticação, engenharia social, phishing":["Princípios: confidencialidade, integridade, disponibilidade (+ autenticidade, não repúdio).","Autenticação: algo que você sabe (senha), tem (token/celular) ou é (biometria); 2FA combina dois fatores.","Engenharia social explora a confiança humana; phishing = mensagem falsa que “pesca” dados; pharming = redireciona por DNS falso.","Senha forte: longa, única por serviço, com gerenciador de senhas."],
"Ameaças: vírus, worms, malware, ransomware":["Vírus: se anexa a arquivos e precisa ser executado.","Worm: se propaga sozinho pela rede, explorando vulnerabilidades.","Trojan: parece legítimo e abre portas. Backdoor: garante retorno do invasor. Rootkit: esconde a invasão.","Ransomware: criptografa os dados e pede resgate. Spyware/keylogger: espionam. Bot/botnet: rede de máquinas “zumbis”."],
"Antivírus, firewall, atualizações e backup":["Antivírus detecta e remove malware; firewall filtra o tráfego de rede (não é antivírus).","Atualizações corrigem vulnerabilidades — mantenha sistema e programas em dia.","Backup completo (tudo), incremental (desde o último backup de qualquer tipo), diferencial (desde o último completo).","Regra 3-2-1: 3 cópias, 2 mídias, 1 fora do local."],
"Correio eletrônico (Outlook) e colaboração online":["Para (principal), Cc (cópia visível), Cco (cópia oculta).","“Responder a todos” não inclui quem estava em Cco.","SMTP envia; POP3 baixa; IMAP sincroniza.","Colaboração: OneDrive/SharePoint/Teams, Google Drive — edição simultânea, histórico de versões, compartilhamento por link."],
"Internet, intranet e navegadores":["Internet: rede pública mundial. Intranet: rede privada da organização com tecnologias da internet. Extranet: intranet aberta a parceiros.","HTTPS = HTTP com criptografia (cadeado). URL = endereço do recurso. DNS traduz nomes em IP.","Navegação anônima não guarda histórico local, mas não esconde você do site nem da rede.","Cookies guardam preferências e sessões; cache guarda cópias para carregar mais rápido."],
"Computação em nuvem":["SaaS: software pronto via navegador (Gmail, Microsoft 365). PaaS: plataforma de desenvolvimento. IaaS: infraestrutura (servidores virtuais).","Nuvem pública, privada e híbrida.","Vantagens: acesso de qualquer lugar, escalabilidade, colaboração. Risco: depende de conexão e da segurança do provedor."],
"Redes de computadores: noções":["LAN (local), MAN (metropolitana), WAN (longa distância).","Roteador interliga redes; switch conecta dispositivos na mesma rede local; access point = Wi-Fi.","Endereço IP identifica a máquina; DNS resolve nomes; DHCP distribui IPs automaticamente."],
"Ferramentas de busca e compartilhamento":["Aspas: frase exata · - exclui um termo · site: restringe o domínio · filetype: tipo de arquivo · OR alterna termos.","Compartilhe por link com permissão adequada (leitor, comentarista, editor)."],
"Conceitos básicos de informática e TI":["Hardware (físico) × software (programas). Sistema operacional gerencia os recursos.","Memória RAM (volátil) × armazenamento (HD/SSD). ROM guarda o firmware.","1 byte = 8 bits; KB, MB, GB e TB crescem de 1.024 em 1.024.","Periféricos: entrada (teclado, mouse), saída (monitor, impressora), entrada e saída (pendrive, multifuncional)."],
"CF/88: princípios e disposições gerais (Título III, Cap. VII)":["LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência (EC 19/98).","Concurso: validade de até 2 anos, prorrogável uma vez por igual período. Durante o prazo, o aprovado tem prioridade sobre novos concursados.","Funções de confiança: só para servidores efetivos. Cargos em comissão: livre nomeação, para direção, chefia e assessoramento.","Acumulação: 2 cargos de professor; professor + técnico/científico; 2 de saúde.","Art. 37, §6º: responsabilidade objetiva do Estado + regresso. Art. 41: estabilidade após 3 anos + avaliação especial de desempenho; perda por sentença transitada, PAD ou avaliação periódica."],
"Organização da Adm. Pública Federal: direta, indireta, descentralização":["Direta: União e seus órgãos (ministérios). Indireta: autarquias, fundações públicas, empresas públicas e sociedades de economia mista.","Autarquia (direito público, criada por lei — ex.: UFBA). Fundação pública. Empresa pública (capital 100% público). SEM (S.A., maioria votante do Estado).","Desconcentração: órgãos na mesma pessoa (hierarquia). Descentralização: outra pessoa (outorga por lei ou delegação por contrato/ato).","Órgão não tem personalidade jurídica; entidade tem."],
"Agentes públicos, atendimento ao cidadão, inclusão e acessibilidade":["Espécies: agentes políticos, servidores (estatutários), empregados públicos (CLT), temporários (art. 37, IX), particulares em colaboração, militares.","Atendimento: urbanidade, presunção de boa-fé, igualdade, acessibilidade, linguagem simples (Lei 13.460/2017).","Inclusão: atendimento prioritário (idosos, PcD, gestantes, lactantes, pessoas com crianças de colo, obesos, TEA); Lei 13.146/2015 (Estatuto da Pessoa com Deficiência)."],
"Lei 8.112/1990: provimento, vacância, direitos e vantagens":["Provimento (art. 8º): nomeação, promoção, readaptação, reversão, aproveitamento, reintegração, recondução.","Posse em 30 dias da publicação; exercício em 15 dias da posse. Estágio probatório: a lei fala em 24 meses, mas prevalecem os 3 anos da CF (o edital fixa 36 meses).","Vacância (art. 33): exoneração, demissão, promoção, readaptação, aposentadoria, posse em outro cargo inacumulável, falecimento.","Remoção desloca o servidor (mesmo quadro); redistribuição desloca o cargo (outro órgão do mesmo Poder).","Férias: 30 dias, acumuláveis até 2 períodos. Licença para capacitação: até 3 meses a cada 5 anos. Licença para tratar de interesses particulares: até 3 anos, sem remuneração."],
"Lei 8.112/1990: deveres, proibições, regime disciplinar e PAD":["Penalidades (art. 127): advertência, suspensão (até 90 dias), demissão, cassação de aposentadoria/disponibilidade, destituição de cargo em comissão e de função comissionada.","Prescrição: 5 anos (demissão, cassação, destituição), 2 anos (suspensão), 180 dias (advertência).","Cancelamento dos registros: advertência após 3 anos; suspensão após 5 anos sem nova infração.","Sindicância: 30 + 30 dias → arquivamento, advertência, suspensão até 30 dias ou PAD. PAD: 60 + 60 dias; comissão de 3 servidores estáveis; afastamento preventivo até 60 + 60 dias.","Abandono: mais de 30 dias consecutivos. Inassiduidade: 60 dias interpolados em 12 meses."],
"Ética: Decreto 1.171/1994 e Decreto 6.029/2007":["Decreto 1.171: regras deontológicas, deveres e vedações do servidor; cada órgão tem Comissão de Ética.","Pena aplicável pela Comissão de Ética: CENSURA (com parecer fundamentado).","Decreto 6.029/2007: Sistema de Gestão da Ética do Executivo Federal, coordenado pela Comissão de Ética Pública (CEP): 7 membros designados pelo Presidente, mandato de 3 anos, uma recondução.","Vedações típicas: usar o cargo para obter favores, receber presentes, retardar trabalho, prejudicar a imagem do serviço."],
"Improbidade administrativa (Lei 8.429/1992 e alterações)":["Após a Lei 14.230/2021, só há improbidade DOLOSA.","Art. 9º enriquecimento ilícito · Art. 10 lesão ao erário · Art. 11 violação de princípios (rol taxativo).","Sanções: perda de bens, ressarcimento, perda da função, suspensão de direitos políticos (até 14 anos no art. 9º; até 12 anos no art. 10), multa e proibição de contratar. No art. 11 não há suspensão de direitos políticos.","Prescrição: 8 anos. Ação: Ministério Público e a pessoa jurídica interessada (legitimidade reconhecida pelo STF em 2022)."],
"Processo administrativo federal (Lei 9.784/1999)":["Princípios (art. 2º): legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público, eficiência.","Prazos: atos em 5 dias (até o dobro, justificado); intimação com 3 dias úteis de antecedência; decisão em 30 dias após a instrução; recurso em 10 dias; reconsideração em 5 dias; julgamento do recurso em 30 dias.","Recurso: no máximo 3 instâncias. Indelegáveis: atos normativos, decisão de recursos, competência exclusiva.","Impedimento (interesse direto, participou como perito/testemunha, litígio) → dever de comunicar. Suspeição (amizade íntima/inimizade notória) → pode ser arguida.","Anulação (ilegalidade) e revogação (conveniência); decadência de 5 anos para anular atos favoráveis, salvo má-fé."],
"LAI (Lei 12.527/2011 e Decreto 7.724/2012)":["Transparência ativa (divulga sem pedido) × passiva (responde a pedidos).","Qualquer interessado pode pedir; é vedado exigir o motivo do pedido.","Resposta: imediata ou em até 20 dias + 10. Recurso: 10 dias; a autoridade superior decide em 5.","Sigilo: ultrassecreta 25, secreta 15, reservada 5 anos. Informação pessoal: até 100 anos.","Serviço gratuito, salvo custo de reprodução."],
"LGPD (Lei 13.709/2018) na Administração Pública":["Dado pessoal: identifica ou torna identificável uma pessoa. Sensível: origem racial, religião, opinião política, sindicato, saúde, vida sexual, genético, biométrico.","Agentes: controlador (decide), operador (executa), encarregado (canal com titulares e ANPD).","Princípios: finalidade, adequação, necessidade, livre acesso, qualidade, transparência, segurança, prevenção, não discriminação, responsabilização.","Poder público: trata dados para executar políticas públicas e competências legais (art. 23), sem depender de consentimento.","LAI + LGPD: transparência é a regra; dados pessoais têm acesso restrito."],
"Licitações e contratos (Lei 14.133/2021)":["Modalidades: pregão, concorrência, concurso, leilão, diálogo competitivo (tomada de preços e convite foram extintos).","Critérios de julgamento: menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance, maior retorno econômico.","Fases: preparatória → divulgação do edital → propostas e lances → julgamento → habilitação → recursal → homologação (em regra, julga-se antes de habilitar).","Contratação direta: dispensa (art. 75, competição possível) e inexigibilidade (art. 74, competição inviável).","Agente de contratação conduz a licitação; fiscal e gestor acompanham o contrato."],
"Governança, integridade, controle e Decreto 9.830/2019":["Governança: liderança, estratégia e controle para avaliar, direcionar e monitorar a gestão.","Gestão de riscos e controles internos; programas de integridade; accountability (prestar contas e ser responsabilizado).","Decreto 9.830/2019 (regulamenta a LINDB): decisões motivadas, considerando consequências práticas; o agente responde por dolo ou erro grosseiro."],
"Governo Digital (Lei 14.129/2021)":["Busca desburocratizar, modernizar e simplificar a relação do poder público com a sociedade, com serviços digitais.","Plataforma única de acesso (gov.br), interoperabilidade e compartilhamento de dados entre órgãos, dados abertos, laboratórios de inovação.","Atendimento digital sem excluir quem não tem acesso: deve haver canais presenciais."],
"Gestão documental e arquivística (Lei 8.159/1991)":["Gestão de documentos (art. 3º): produção, tramitação, uso, avaliação e arquivamento nas fases corrente e intermediária.","Arquivos públicos (art. 8º): correntes, intermediários e permanentes.","Permanentes: inalienáveis e imprescritíveis. Eliminação só com autorização da instituição arquivística pública.","CONARQ define a política nacional de arquivos."],
"Recursos materiais e patrimoniais":["Almoxarifado guarda materiais de consumo; patrimônio controla bens permanentes (tombamento, plaqueta, termo de responsabilidade).","Inventário: conferência física periódica (anual, de transferência, de extinção, eventual).","Desfazimento de bens inservíveis: ocioso, recuperável, antieconômico, irrecuperável."],
"Sustentabilidade e A3P":["A3P (Ministério do Meio Ambiente) — 6 eixos: uso racional dos recursos, gestão de resíduos, qualidade de vida no trabalho, sensibilização e capacitação, contratações sustentáveis e construções sustentáveis.","Política dos 5 Rs: repensar, recusar, reduzir, reutilizar, reciclar.","A Lei 14.133 tem como princípio o desenvolvimento nacional sustentável."],
"Atendimento ao público e Carta de Serviços ao Usuário":["Lei 13.460/2017: direitos do usuário — urbanidade, respeito, presunção de boa-fé, igualdade, acessibilidade, linguagem simples.","Carta de Serviços (art. 7º): informa os serviços, requisitos, prazos, formas de acesso e padrões de qualidade.","Ouvidoria: decisão em 30 dias + 30. Manifestações: reclamação, denúncia, sugestão, elogio, solicitação de providências."],
"Segurança da informação no ambiente de trabalho":["Bloqueie a tela ao sair (Win+L); mesa limpa; não compartilhe senhas.","E-mail institucional só para o serviço; desconfie de links e anexos inesperados.","Dados pessoais só para a finalidade do serviço (LGPD); comunique incidentes."],
"Redação oficial e comunicação administrativa":["Veja o resumo de Redação Oficial em Língua Portuguesa — o conteúdo é o mesmo do Manual 3ª ed.","Documentos do dia a dia: ofício, despacho, e-mail institucional, ata, relatório, requerimento, certidão."],
"IFES: estrutura, autonomia universitária e colegiados":["CF art. 207: autonomia didático-científica, administrativa e de gestão financeira e patrimonial; indissociabilidade entre ensino, pesquisa e extensão.","Universidades federais são autarquias (ou fundações) vinculadas ao MEC.","Reitor: nomeado pelo Presidente da República a partir de lista tríplice, mandato de 4 anos com uma recondução.","Gestão colegiada: conselhos superiores deliberativos; unidades (institutos, faculdades, escolas) com congregação e departamentos/colegiados de curso."],
"Estatuto e Regimento Geral da UFBA":["Leia o texto oficial: ufba.br/arquivos/estatuto-e-regimento-geral — a banca cobra literalidade.","Foque em: finalidades e princípios da UFBA; órgãos da Administração Superior (conselhos e Reitoria) e suas competências; Unidades Universitárias; comunidade universitária (direitos e deveres); regime disciplinar.","Monte uma tabela “órgão → composição → competências”: é o formato que mais cai."],
"Estado, governo e Administração Pública: conceitos e princípios":["Elementos do Estado: povo, território e governo soberano.","Poderes: Legislativo, Executivo e Judiciário, com funções típicas e atípicas.","Governo = função política (decide). Administração = função executiva (executa).","Sentido subjetivo/orgânico = quem exerce (órgãos, entidades, agentes). Sentido objetivo/material = a atividade (serviço público, polícia administrativa, fomento, intervenção)."],
"Organização administrativa da União: direta e indireta":["Veja também o resumo da Adm. Pública (direta, indireta, descentralização).","Autarquia e fundação pública de direito público: criadas por lei. Empresa pública, SEM e fundação de direito privado: lei autoriza a criação.","Controle da indireta: supervisão ministerial/tutela (vinculação, não hierarquia)."],
"Agentes públicos: espécies, cargo, emprego e função":["Cargo: regime estatutário (servidor). Emprego: regime celetista (empregado público). Função: atribuições sem cargo (temporários ou funções de confiança).","Particulares em colaboração: mesários, jurados, delegados (concessionários, tabeliães).","Deveres: agir, eficiência, probidade, prestar contas. Prerrogativas decorrem do cargo."],
"Poderes administrativos e uso/abuso do poder":["Hierárquico: ordenar, fiscalizar, delegar, avocar, rever atos. Disciplinar: punir servidores e quem tem vínculo especial.","Regulamentar: decretos para fiel execução das leis (CF 84, IV); decreto autônomo (84, VI).","Polícia: limita direitos em favor do interesse público; atributos: discricionariedade, autoexecutoriedade, coercibilidade; ciclo: ordem, consentimento, fiscalização e sanção.","Abuso: excesso de poder (fora da competência) ou desvio de finalidade (fim diverso). A omissão também pode ser abuso."],
"Serviços públicos e delegação (concessão, permissão, autorização)":["Princípios (Lei 8.987, art. 6º): regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia, modicidade das tarifas.","Uti universi (gerais, indivisíveis) × uti singuli (individuais, mensuráveis).","Concessão: contrato, licitação (concorrência ou diálogo competitivo), PJ ou consórcio, prazo determinado.","Permissão: contrato de adesão, precária, PF ou PJ. Autorização: ato unilateral, discricionário e precário."],
"Controle da Administração e responsabilidade civil do Estado":["Quanto ao órgão: administrativo (autotutela — Súmula 473), legislativo (Congresso + TCU) e judicial (só legalidade).","Quanto ao momento: prévio, concomitante e posterior. Interno × externo.","Responsabilidade objetiva (risco administrativo): basta ato, dano e nexo causal. Excludentes: culpa exclusiva da vítima, caso fortuito/força maior, fato de terceiro. Culpa concorrente atenua.","Regresso contra o agente com dolo ou culpa; a vítima aciona o Estado, não o agente (STF, Tema 940).","Omissão genérica: em regra, responsabilidade subjetiva (falha do serviço)."],
"Licitações (Lei 14.133/2021): modalidades, dispensa, inexigibilidade, fases":["Pregão: bens e serviços comuns (menor preço ou maior desconto). Concorrência: bens e serviços especiais e obras/serviços de engenharia. Concurso: trabalho técnico, científico ou artístico (prêmio). Leilão: alienação (maior lance). Diálogo competitivo: soluções inovadoras.","Inexigibilidade (art. 74): fornecedor exclusivo, artista consagrado, serviço técnico de notória especialização, credenciamento, imóvel singular.","Dispensa (art. 75): baixo valor, emergência, licitação deserta/fracassada, entre outros. Licitação dispensada (art. 76): alienações.","Revogação por interesse público (fato superveniente); anulação por ilegalidade — sempre com contraditório."],
"Organizações formais: estrutura e departamentalização":["Organização formal: planejada, oficial, com organograma. Informal: relações espontâneas.","Estruturas: linear (unidade de comando), funcional (especialistas, multiplicidade de comando), linha-staff (assessoria), divisional, matricial (dupla subordinação), em rede.","Departamentalização: funcional, por produto/serviço, geográfica, por clientela, por processo, por projeto, matricial.","Conceitos: cadeia de comando, amplitude de controle, centralização × descentralização, formalização."],
"Processo organizacional: planejamento, direção, comunicação, controle":["Planejamento: estratégico (longo prazo, cúpula), tático (médio, gerências), operacional (curto, execução). Missão, visão, valores; SWOT.","Direção: liderança, motivação, comunicação, tomada de decisão (programadas × não programadas).","Controle: estabelecer padrões → medir → comparar → corrigir.","Mintzberg: papéis interpessoais, informacionais e decisórios. Katz: habilidades técnicas, humanas e conceituais."],
"Gestão de processos":["Processo: atividades que transformam entradas em saídas de valor para um cliente.","Mapeamento: fluxograma, BPMN, SIPOC (fornecedores, entradas, processo, saídas, clientes).","Melhoria: redesenho, eliminação de etapas sem valor, indicadores, PDCA."],
"Gestão da qualidade":["PDCA: Plan, Do, Check, Act. 5S: utilização, ordenação, limpeza, saúde, autodisciplina.","Ferramentas: Ishikawa (6M), Pareto (80/20), histograma, folha de verificação, fluxograma, diagrama de dispersão, carta de controle, 5W2H.","Deming, Juran (trilogia: planejamento, controle, melhoria), Crosby (zero defeito); ISO 9001."],
"Gestão de projetos":["Projeto: esforço temporário, resultado único. Operação: contínua.","Grupos de processos (PMBOK): iniciação, planejamento, execução, monitoramento e controle, encerramento.","Restrição tripla: escopo, prazo e custo. EAP decompõe o escopo; Gantt mostra o cronograma; caminho crítico = sequência sem folga.","Stakeholders: todos os afetados pelo projeto."],
"Gestão de pessoas: conceitos e função do órgão de GP":["Chiavenato — 6 processos: agregar (recrutar/selecionar), aplicar (desenho de cargos, avaliação), recompensar, desenvolver (treinamento), manter (higiene, qualidade de vida), monitorar (sistemas de informação).","Recrutamento interno (rápido, barato, motiva) × externo (novas ideias).","Treinamento: diagnóstico (levantamento de necessidades) → programação → execução → avaliação.","Avaliação de desempenho: 360°, escalas gráficas, incidentes críticos, autoavaliação."],
"Comportamento organizacional: motivação e liderança":["Maslow: fisiológicas → segurança → sociais → estima → autorrealização.","Herzberg: fatores higiênicos (evitam insatisfação) × motivacionais (geram satisfação). McGregor: Teoria X (pessimista) × Y (otimista).","McClelland: realização, afiliação, poder. Vroom: expectativa × instrumentalidade × valência.","Liderança: autocrática, democrática, liberal; situacional (determinar, persuadir, compartilhar, delegar); transacional × transformacional."],
"Recursos materiais: classificação e gestão de estoques":["Atributos da classificação: abrangência, flexibilidade, praticidade.","ABC (valor) e XYZ (criticidade; Z = imprescindível).","Ponto de pedido = consumo médio × tempo de reposição + estoque de segurança. Giro = consumo ÷ estoque médio.","Métodos de saída: PEPS/FIFO (primeiro que entra, primeiro que sai), UEPS, custo médio."],
"Compras, modalidades e cadastro de fornecedores":["Ciclo de compras: requisição → pesquisa de preços → seleção do fornecedor → pedido/contrato → acompanhamento → recebimento.","Na Administração Pública, as compras seguem a Lei 14.133 (modalidades e contratação direta). Sistema de Registro de Preços para compras frequentes.","Cadastro de fornecedores: habilitação jurídica, fiscal, econômica e técnica. No governo federal: SICAF."],
"Recebimento, conferência e armazenagem":["Etapas: entrada (conferência documental: nota × pedido) → conferência quantitativa → conferência qualitativa → regularização (aceite ou devolução).","Armazenagem: itens de maior giro perto da saída; pesados embaixo; perigosos e inflamáveis isolados; FIFO; boa identificação e endereçamento.","Técnicas: carga unitária, paletes, estantes, empilhamento."],
"Arquivologia: conceitos e gestão de documentos":["Arquivo: documentos produzidos e recebidos por uma entidade no exercício de suas funções.","Princípios: proveniência (respeito aos fundos), organicidade, unicidade, indivisibilidade, cumulatividade.","Gestão de documentos: produção, tramitação, uso, avaliação e arquivamento.","Diagnóstico: levantamento da situação dos arquivos (volume, estado, espaço, organização) antes de intervir."],
"Arquivos correntes, intermediários e permanentes":["Corrente: uso frequente, junto ao setor produtor. Intermediário: uso eventual, aguardando destinação. Permanente: valor histórico, probatório e informativo; guarda definitiva.","Transferência (corrente → intermediário); recolhimento (→ permanente).","Métodos de arquivamento: alfabético, geográfico (diretos); numéricos (simples, cronológico, dígito-terminal) e por assunto (indiretos, precisam de índice)."],
"Protocolo e avaliação de documentos":["Protocolo: recebimento, classificação, registro, distribuição, controle da tramitação e expedição.","Avaliação: define prazos de guarda e destinação — feita pela Comissão Permanente de Avaliação de Documentos (CPAD).","Tabela de temporalidade: prazos nas fases corrente e intermediária e destinação final (eliminação ou guarda permanente).","Valor primário (administrativo, para o produtor) × secundário (histórico/informativo, para a sociedade)."],
"Tipologias, suportes, microfilmagem e automação":["Espécie (ata, ofício) × tipo (ata de reunião do Conselho) × gênero (textual, iconográfico, cartográfico, audiovisual, sonoro, micrográfico, digital).","Suporte: papel, filme, meio magnético ou óptico.","Microfilme tem o mesmo valor legal do original (Lei 5.433/1968; Decreto 1.799/1996); documentos de valor permanente não devem ser eliminados após a microfilmagem.","Automação: GED, digitalização, processo eletrônico (SEI). Documento digital (nasce digital) × digitalizado (convertido do papel)."],
"Preservação, conservação e restauração":["Preservação: política ampla que garante a integridade. Conservação preventiva: controla o ambiente (temperatura e umidade estáveis, luz, poeira, pragas). Restauração: intervenção direta no documento danificado.","Evite clipes metálicos, grampos, fita adesiva e plastificação.","Agentes de deterioração: físicos (luz, calor), químicos (acidez, poluição) e biológicos (fungos, insetos, roedores)."],
"Atendimento ao público: qualidade e postura":["Qualidades cobradas: comunicabilidade, apresentação, atenção, cortesia, interesse, presteza, eficiência, tolerância, discrição, conduta e objetividade.","Escuta ativa, linguagem clara, não prometer o que não pode cumprir, encaminhar corretamente.","Usuário irritado: calma, empatia, foco na solução, registro da demanda."],
"Trabalho em equipe, relações interpessoais e comunicação":["Empatia, compreensão mútua, feedback construtivo; comportamento receptivo × defensivo.","Janela de Johari: aberta, cega, oculta, desconhecida.","Comunicação: emissor, mensagem, código, canal, receptor, feedback, ruído. Formal × informal; vertical (descendente/ascendente) e horizontal.","Opinião pública: a imagem do órgão depende da conduta de cada servidor."],

function isoDate(d){ const z = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function parseIso(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDias(iso, n){ const d = parseIso(iso); d.setDate(d.getDate()+n); return isoDate(d); }
function diasEntre(a, b){ return Math.round((parseIso(b) - parseIso(a)) / 86400000); }
function fmtData(iso, opts={day:"2-digit",month:"2-digit"}){ return parseIso(iso).toLocaleDateString("pt-BR", opts); }

  return {
    dataProva: EDITAL.dataProva, horasDia: 2, diasSemana: 6, meta: 60,
    topicos, respostas: [], erros: {}, flash: {}, sessoes: [], simulados: [], redacoes: [],
    qExtras: [], fcExtras: [], checklist: {},
  };
}

try { S = Object.assign(estadoInicial(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { S = estadoInicial(); }

/* Repetição espaçada simples (caixas de Leitner) */
const INTERVALOS = [1, 3, 7, 15, 30, 60];
function agendar(item, acertou){
  item.caixa = acertou ? Math.min((item.caixa||0)+1, INTERVALOS.length-1) : 0;
  item.proxima = addDias(hoje(), acertou ? INTERVALOS[item.caixa] : 1);
}

function diasParaProva(){ return diasEntre(hoje(), S.dataProva); }
function statsArea(){
  const out = {};
  for (const a of AREAS){
    const tps = S.topicos[a.id] || [];
    const rs = S.respostas.filter(r => r.a === a.id);
    const ac = rs.filter(r => r.ok).length;
    out[a.id] = { total: tps.length, estudados: tps.filter(t=>t.estudado).length, resp: rs.length, acertos: ac, taxa: rs.length ? ac/rs.length : null };
  }
  return out;
}
function statsTopico(area, nome){
  const rs = S.respostas.filter(r => r.a === area && r.t === nome);
  return { n: rs.length, taxa: rs.length ? rs.filter(r=>r.ok).length/rs.length : null };
}
function indiceProntidao(){
  const st = statsArea(); let soma = 0;
  for (const a of AREAS){
    const s = st[a.id]; const peso = a.q*a.peso/TOTAL_OBJ;
    const cob = s.total ? s.estudados/s.total : 0;
    const des = s.taxa == null ? 0 : s.taxa;
    soma += peso * (0.5*cob + 0.5*des);
  }
  return Math.round(soma*100);
}
function constancia(){
  const dias = new Set([...S.sessoes.map(s=>s.data), ...S.respostas.map(r=>r.data)]);
  let streak = 0; let d = hoje();
  if (!dias.has(d)) d = addDias(d,-1);
  while (dias.has(d)){ streak++; d = addDias(d,-1); }
  return { streak, dias };
}
function minutosPorDia(n=14){
  const out = [];
  for (let i=n-1;i>=0;i--){ const d = addDias(hoje(),-i); out.push({ d, m: S.sessoes.filter(s=>s.data===d).reduce((x,s)=>x+s.min,0) }); }
  return out;
}
function errosVencidos(){ return Object.entries(S.erros).filter(([,e]) => e.proxima <= hoje()); }
function flashVencidos(){ return todosFlash().filter(f => { const s = S.flash[f.id]; return !s || s.proxima <= hoje(); }); }
function proximoEvento(){ return DATAS.filter(d => d.fim >= hoje()).sort((a,b)=>a.fim.localeCompare(b.fim))[0]; }

function prioridadeTopicos(){
  const lista = [];
  for (const a of AREAS){
    const tps = S.topicos[a.id]; const pesoTop = (a.q*a.peso)/Math.max(1,tps.length);
    for (const t of tps){
      const s = statsTopico(a.id, t.nome);
      const fraqueza = s.taxa == null ? 0.6 : 1 - s.taxa;
      const naoEst = t.estudado ? 0.35 : 1;
      lista.push({ area:a.id, t, score: pesoTop * (0.5*naoEst + 0.5*fraqueza), taxa:s.taxa });
    }
  }
  return lista.sort((x,y)=>y.score-x.score);
}

/* =========================================================================
   PLANO DE ESTUDOS DIVERSIFICADO
   Cada dia de estudo tem 2 blocos de áreas DIFERENTES (Específicos quase
   todo dia, alternando com LP / AP / Informática) + uma atividade fixa do
   dia da semana. As 3 últimas semanas são de reta final (revisão e simulados).
   ========================================================================= */
const CURTO = { lp: "Português", inf: "Informática", ap: "Adm. Pública", ce: "Específicos" };
const DIAS_SEM = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DIAS_SEM_LONGO = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const ATIV_DIA = {
  1: { t: "Lei seca: Lei 8.112/1990 (20 min)", l: "#/conteudo?a=ap" },
  2: { t: "Flashcards + Meus erros (20 min)", l: "#/flashcards" },
  3: { t: "Redação da semana (60 min)", l: "#/redacao" },
  4: { t: "Lei seca: 9.784, LAI e LGPD (20 min)", l: "#/conteudo?a=ap" },
  5: { t: "20 questões mistas das 4 áreas", l: "#/questoes" },
  6: { t: "Mini simulado + correção dos erros", l: "#/simulados" },
  0: { t: "Revisão leve: erros e flashcards da semana", l: "#/erros" },
};
const PESO_ROD = { ce: 1.5, ap: 1.1, lp: 1.1, inf: 0.8 };
function diasAtivos(){
  const n = S.diasSemana;
  return new Set(n >= 7 ? [0,1,2,3,4,5,6] : n === 6 ? [1,2,3,4,5,6] : n === 5 ? [1,2,3,4,5] : n === 4 ? [1,2,4,6] : n === 3 ? [1,3,5] : n === 2 ? [2,6] : [6]);
}
function temaDaSemana(data){
  const idx = Math.floor(diasEntre("2026-09-28", data) / 7);
  return TEMAS_REDACAO[((idx % TEMAS_REDACAO.length) + TEMAS_REDACAO.length) % TEMAS_REDACAO.length];
}
function gerarPlanoEstudos(){
  const ativos = diasAtivos();
  const inicioReta = addDias(S.dataProva, -21);
  const prio = prioridadeTopicos();
  const fila = Object.fromEntries(AREAS.map(a => [a.id, prio.filter(p => p.area === a.id && !p.t.estudado)]));
  const fracos = Object.fromEntries(AREAS.map(a => [a.id, prio.filter(p => p.area === a.id && p.t.estudado)]));
  // Hoje fica "congelado" para não mudar enquanto você marca tópicos ao longo do dia
  const cache = S.planoHoje && S.planoHoje.data === hoje() ? S.planoHoje : null;
  if (cache) for (const b of cache.blocos) if (fila[b.area]) fila[b.area] = fila[b.area].filter(p => !b.topicos.includes(p.t.nome));

  // Quantos blocos de conteúdo existem até a reta final → tópicos por bloco
  let blocosDisp = 0;
  for (let d = hoje(); d < inicioReta; d = addDias(d, 1)) { const w = parseIso(d).getDay(); if (ativos.has(w) && w !== 0) blocosDisp += w === 6 ? 1 : 2; }
  const pend = AREAS.reduce((s, a) => s + fila[a.id].length, 0);
  const porBloco = Math.min(3, Math.max(1, Math.ceil(pend / Math.max(1, blocosDisp))));

  // Ritmo proporcional: cada área avança na proporção do que falta nela, para
  // todas terminarem juntas (Específicos com peso extra) → mistura real de matérias.
  const quota = Object.fromEntries(AREAS.map(a => [a.id, fila[a.id].length * (a.id === "ce" ? 1.25 : 1)]));
  const somaQuota = Object.values(quota).reduce((x, y) => x + y, 0) || 1;
  const feitos = Object.fromEntries(AREAS.map(a => [a.id, 0])); let nBlocosConteudo = 0;
  const ultimoUso = Object.fromEntries(AREAS.map(a => [a.id, -99])); let diaIdx = 0;
  const dias = []; let ontem = []; const rodizioRev = { i: 0 };
  const pegaRevisao = excl => {
    const ordem = AREAS.map(a => a.id).filter(a => !excl.includes(a));
    for (let k = 0; k < ordem.length; k++) {
      const a = ordem[(rodizioRev.i + k) % ordem.length]; const lst = fracos[a];
      if (lst.length) { rodizioRev.i++; const p = lst.shift(); lst.push(p); return { area: a, topicos: [p.t.nome], tipo: "Revisão" }; }
    }
    return null;
  };
  for (let d = hoje(); d <= S.dataProva; d = addDias(d, 1)) {
    const w = parseIso(d).getDay();
    if (d === S.dataProva) { dias.push({ data: d, w, fase: "prova", blocos: [] }); break; }
    if (d === addDias(S.dataProva, -1)) { dias.push({ data: d, w, fase: "vespera", blocos: [] }); continue; }
    if (!ativos.has(w)) { dias.push({ data: d, w, fase: "folga", blocos: [] }); continue; }
    const reta = d >= inicioReta;
    let blocos = [];
    if (d === hoje() && cache) blocos = cache.blocos;
    else if (w === 0) blocos = [];
    else {
      const nBlocos = w === 6 ? 1 : 2; const usadas = [];
      for (let k = 0; k < nBlocos; k++) {
        if (!reta) {
          const cand = AREAS.map(a => a.id).filter(a => fila[a].length && !usadas.includes(a))
            .map(a => ({ a, s: (quota[a] / somaQuota) * (nBlocosConteudo + 1) - feitos[a] + 0.12 * Math.min(4, diaIdx - ultimoUso[a]) }))
            .sort((x, y) => y.s - x.s);
          if (cand.length) {
            const a = cand[0].a; usadas.push(a); nBlocosConteudo++; feitos[a]++; ultimoUso[a] = diaIdx;
            const tps = fila[a].splice(0, porBloco);
            tps.forEach(p => fracos[a].push(p)); // entra na fila de revisão da reta final
            blocos.push({ area: a, topicos: tps.map(p => p.t.nome), tipo: "Teoria + questões" }); continue;
          }
        }
        const r = pegaRevisao(usadas); if (r) { usadas.push(r.area); blocos.push(r); }
      }
    }
    if (d === hoje() && !cache) { S.planoHoje = { data: d, blocos }; salvar(); }
    ontem = blocos.map(b => b.area); diaIdx++;
    dias.push({ data: d, w, fase: reta ? "reta" : "conteudo", blocos });
  }
  return { dias, porBloco, pend };
}
function atividadeDoDia(dia){
  if (dia.fase === "prova") return { t: "PROVA — chegue cedo, documento com foto e caneta azul/preta transparente", l: "#/cronograma" };
  if (dia.fase === "vespera") return { t: "Véspera: revisão leve dos flashcards, separar documentos, dormir cedo", l: "#/flashcards" };
  if (dia.fase === "reta" && (dia.w === 6 || dia.w === 3)) return { t: "Simulado COMPLETO cronometrado (objetiva + redação em 4h)", l: "#/simulados" };
  const a = ATIV_DIA[dia.w];
  if (dia.w === 3) return { t: `Redação: “${temaDaSemana(dia.data)[1]}”`, l: "#/redacao?tema=" + encodeURIComponent(temaDaSemana(dia.data)[1]) };
  return a;
}

  const r = el.querySelector("#h"), o = el.querySelector("#ho");

  el.querySelector("#gerar").onclick = () => { S.horasDia = Number(r.value); salvar(); gerar(S.horasDia * 60); };
  el.querySelector("#ruim").onclick = () => gerar(20);
  gerar(S.horasDia * 60);
};
function montarAgenda(dia, min){
  const itens = []; let resto = min;
  if (dia.fase === "prova" || dia.fase === "vespera") { const a = atividadeDoDia(dia); return [{ min, tit: a.t, tipo: dia.fase === "prova" ? "Dia da prova" : "Véspera", link: a.l }]; }
  const ev = errosVencidos().length, fv = flashVencidos().length; const teto = Math.round(min * 0.25);
  if (fv && resto >= 10) { const m = Math.min(teto, Math.max(5, Math.ceil(fv * 0.6))); itens.push({ min: m, tit: `Revisar ${fv} flashcards vencidos`, link: "#/flashcards", tipo: "Revisão espaçada" }); resto -= m; }
  if (ev && resto >= 15) { const m = Math.max(5, Math.min(teto, ev * 3)); itens.push({ min: m, tit: `Refazer ${ev} questões erradas`, link: "#/erros", tipo: "Revisão espaçada" }); resto -= m; }
  if (min <= 20) return itens.length ? itens : [{ min, tit: "Flashcards de lei seca", tipo: "Mínimo do dia", link: "#/flashcards" }];
  const extra = dia.fase === "folga" ? null : atividadeDoDia(dia);
  const minExtra = extra ? Math.min(resto * 0.35, /Redação|Simulado/.test(extra.t) ? 60 : 20) : 0;
  const blocos = dia.blocos.length ? dia.blocos : [];
  const porBloco = blocos.length ? Math.floor((resto - minExtra) / blocos.length) : 0;
  for (const b of blocos) {
    if (porBloco < 15) break;
    const teoria = Math.round(porBloco * 0.55), quest = porBloco - teoria;
    const nomes = b.topicos.join(" · ");
    itens.push({ min: teoria, tit: `${b.tipo === "Revisão" ? "Revisar" : "Estudar"}: ${nomes}`, sub: AREA[b.area].nome, tipo: `Teoria · ${AREA[b.area].nome}`, link: `#/resumo?a=${b.area}&t=${encodeURIComponent(b.topicos[0])}`, cor: AREA[b.area].cor });
    itens.push({ min: quest, tit: `Questões: ${nomes}`, sub: `~${Math.max(4, Math.round(quest / 2.5))} questões (app + QConcursos filtrando AOCP/Avalia)`, tipo: "Questões", link: `#/questoes?a=${b.area}`, cor: AREA[b.area].cor });
    resto -= porBloco;
  }
  if (extra && resto >= 5) itens.push({ min: Math.round(resto), tit: extra.t, tipo: "Atividade do dia", link: extra.l });
  if (dia.fase === "folga" && !itens.length) itens.push({ min, tit: "Dia de folga no plano — descanse. Se quiser, faça só os flashcards.", tipo: "Folga", link: "#/flashcards" });
  return itens;
}
function renderPlano(itens){
  const total = itens.reduce((s, i) => s + i.min, 0);
  return `<div class="card"><div class="row between"><h2>Agenda de hoje</h2><span class="pill">${total} min</span></div>
    ${itens.map(i => `<div class="plan-item"><div class="min">${i.min} min</div><div style="flex:1"><div class="small muted">${i.cor ? `<span class="area-dot" style="background:${i.cor};margin-right:6px"></span>` : ""}${esc(i.tipo)}</div><div style="font-weight:600">${esc(i.tit)}</div>${i.sub ? `<div class="small muted">${esc(i.sub)}</div>` : ""}</div><a class="btn btn-sm btn-ghost" href="${i.link}">Abrir →</a></div>`).join("")}
    <div class="btn-row"><a class="btn btn-primary" href="#/foco">Iniciar modo foco</a></div></div>`;
}

  wrap.querySelectorAll(".alt").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i); const ok = i === q.c;
    if (opts.semFeedback){ wrap.querySelectorAll(".alt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); onResp(i, ok); return; }
    wrap.querySelectorAll(".alt").forEach(x => { x.disabled = true; const xi = Number(x.dataset.i); if (xi===q.c) x.classList.add("ok"); else if (xi===i) x.classList.add("bad"); });

  });
  return wrap;
}
function registrarResposta(q, ok){
  S.respostas.push({ id:q.id, a:q.a, t:q.t, ok, data:hoje() });
  if (!ok){ S.erros[q.id] = S.erros[q.id] || { caixa:0, vezes:0, desde:hoje() }; S.erros[q.id].vezes++; agendar(S.erros[q.id], false); }
  else if (S.erros[q.id]) { agendar(S.erros[q.id], true); if (S.erros[q.id].caixa >= 3) delete S.erros[q.id]; }
  salvar();
}

function rodarSimulado(el, qs){
  const resp = {}; const t0 = Date.now(); const limite = Math.round(qs.length * 3.2 * 60);
  el.innerHTML = `<div class="container" style="max-width:780px"><div class="row between" style="position:sticky;top:0;background:var(--bg-subtle);padding:10px 0;z-index:5"><b>Simulado · ${qs.length} questões</b><span class="pill" id="st"></span></div><div id="sq"></div>
    <div class="btn-row"><button class="btn btn-primary" id="fim">Entregar e corrigir</button></div></div>`;
  const box = el.querySelector("#sq");
  qs.forEach((q,i) => { const h = document.createElement("div"); h.className="small muted"; h.style.margin="18px 0 6px"; h.textContent=`${i+1}.`; box.append(h, renderQuestao(q, (alt) => { resp[q.id] = alt; }, {semFeedback:true})); });
  const tick = setInterval(() => { const s = Math.round((Date.now()-t0)/1000); el.querySelector("#st").textContent = `⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} / ${Math.round(limite/60)} min`; }, 1000);
  limpar = () => clearInterval(tick);
  el.querySelector("#fim").onclick = () => {
    const semResp = qs.filter(q=>resp[q.id]==null).length;
    if (semResp && !confirm(`${semResp} questão(ões) sem resposta. Entregar mesmo assim?`)) return;
    clearInterval(tick);
    const porArea = Object.fromEntries(AREAS.map(a=>[a.id,{n:0,ok:0}]));
    qs.forEach(q => { const ok = resp[q.id] === q.c; porArea[q.a].n++; if (ok) porArea[q.a].ok++; if (resp[q.id]!=null) registrarResposta(q, ok); });
    const proj = AREAS.reduce((s,a)=>{ const p = porArea[a.id]; return s + (p.n ? p.ok/p.n : 0) * a.q * a.peso; }, 0);
    const zerou = AREAS.filter(a=>porArea[a.id].n && !porArea[a.id].ok);
    const acertos = qs.filter(q=>resp[q.id]===q.c).length;
    const min = Math.round((Date.now()-t0)/60000);
    S.simulados.push({data:hoje(), acertos, total:qs.length, proj, min}); S.sessoes.push({data:hoje(), min, a:"ce"}); salvar();
    el.innerHTML = `<div class="container" style="max-width:780px">${header("Simulado · Resultado", `${acertos}/${qs.length} acertos`)}
      <div class="grid g3"><div class="stat"><div class="v">${proj.toFixed(1)}</div><div class="l">nota projetada (0–90)</div></div><div class="stat"><div class="v">${min} min</div><div class="l">tempo usado</div></div>
      <div class="stat"><div class="v">${proj>=45&&!zerou.length?"✓":"✗"}</div><div class="l">${proj>=45&&!zerou.length?"acima do mínimo (45 pts)":zerou.length?"zerou: "+zerou.map(a=>a.nome).join(", "):"abaixo de 45 pts"}</div></div></div>
      <div class="card" style="margin-top:14px"><table><thead><tr><th>Área</th><th class="n">Acertos</th><th class="n">%</th><th class="n">Projeção</th></tr></thead><tbody>
      ${AREAS.map(a=>{const p=porArea[a.id];return `<tr><td>${areaTag(a.id)}</td><td class="n">${p.ok}/${p.n}</td><td class="n">${p.n?pct(p.ok/p.n):"—"}</td><td class="n">${(p.n?p.ok/p.n*a.q*a.peso:0).toFixed(1)} / ${a.q*a.peso}</td></tr>`}).join("")}</tbody></table></div>
      <h3>Gabarito comentado</h3>
      ${qs.map((q,i)=>`<div class="card"><div class="small muted">${i+1}. ${AREA[q.a].nome}</div><div class="q-enun" style="margin-bottom:8px">${esc(q.e)}</div>
        <div class="small">Sua resposta: <b style="color:${resp[q.id]===q.c?"var(--success)":"var(--danger)"}">${resp[q.id]!=null?"ABCDE"[resp[q.id]]:"—"}</b> · Gabarito: <b>${"ABCDE"[q.c]}) ${esc(q.o[q.c])}</b></div>${q.x?`<div class="expl">${esc(q.x)}</div>`:""}</div>`).join("")}
      <div class="btn-row"><a class="btn btn-primary" href="#/erros">Ir para Meus erros</a><a class="btn btn-secondary" href="#/desempenho">Ver desempenho</a></div></div>`;
  };
}

const AREA_EXTRA = { rl: { id: "rl", nome: "Raciocínio Lógico (não cai na UFBA)", cor: "var(--muted)" } };
const areaInfo = id => AREA[id] || AREA_EXTRA[id] || { id, nome: "Sem área", cor: "var(--border-strong)" };
function todasProvas(){ return [...PROVAS, ...(S.provasExtras || [])]; }
function estadoProva(id){ S.provas = S.provas || {}; return S.provas[id] = S.provas[id] || { resp: {}, gab: "", estrutura: null, tentativas: [] }; }
function parseEstrutura(str, n){
  const mapa = {};
  (str || "").split(",").map(x => x.trim()).filter(Boolean).forEach(parte => {
    const m = parte.match(/^(\w+)\s*:\s*(\d+)\s*-\s*(\d+)$/); if (!m) return;
    for (let i = Number(m[2]); i <= Number(m[3]); i++) if (i <= n) mapa[i] = m[1];
  });
  return mapa;
}
function parseGabarito(txt, n, tipo){
  const letras = tipo === "CE" ? "CE" : "ABCDE"; const g = {};
  const t = (txt || "").toUpperCase();
  const pares = [...t.matchAll(/(\d+)\s*[-.:)=]?\s*([A-E]|X|ANULADA)/g)];
  if (pares.length >= Math.min(5, n)) pares.forEach(m => { const q = Number(m[1]); if (q >= 1 && q <= n) g[q] = m[2].startsWith("X") || m[2] === "ANULADA" ? "X" : m[2]; });
  else {
    const toks = t.split(/[^A-Z]+/).filter(x => /^[A-EX]+$/.test(x));
    [...toks.join("")].forEach((c, i) => { if (i < n) g[i + 1] = c; });
  }
  for (const k in g) if (g[k] !== "X" && !letras.includes(g[k])) delete g[k];
  return g;
}

function importarQuestoes(texto, areaPadrao){
  const nomesTop = new Set(AREAS.flatMap(a => S.topicos[a.id].map(t => t.nome)));
  let ok = 0, erro = 0;
  for (const bloco of texto.split(/\n\s*-{3,}\s*\n?/)) {
    const linhas = bloco.split("\n").map(l => l.trim()).filter(Boolean); if (!linhas.length) continue;
    let a = areaPadrao, t = "", fonte = "", gab = null, x = ""; const alts = []; const en = [];
    for (const l of linhas) {
      let m;
      if ((m = l.match(/^[ÁA]rea\s*:\s*(\w+)/i))) { const v = m[1].toLowerCase(); if (AREA[v]) a = v; continue; }
      if ((m = l.match(/^T[óo]pico\s*:\s*(.+)/i))) { t = m[1].trim(); continue; }
      if ((m = l.match(/^Fonte\s*:\s*(.+)/i))) { fonte = m[1].trim(); continue; }
      if ((m = l.match(/^(Gabarito|Resposta)\s*:\s*([A-E])/i))) { gab = "ABCDE".indexOf(m[2].toUpperCase()); continue; }
      if ((m = l.match(/^Coment[áa]rio\s*:\s*(.*)/i))) { x = m[1]; continue; }
      if ((m = l.match(/^\(?([A-Ea-e])\s*[).:-]\s*(.+)/)) && ("abcde".indexOf(m[1].toLowerCase()) === alts.length)) { alts.push(m[2].trim()); continue; }
      if (alts.length) alts[alts.length - 1] += " " + l; else en.push(l);
    }
    if (!en.length || alts.length < 2 || gab == null || gab >= alts.length) { erro++; continue; }
    S.qExtras.push({ id: "i" + Date.now() + "-" + ok, a, t: nomesTop.has(t) ? t : "", e: (fonte ? `[${fonte}] ` : "") + en.join("\n"), o: alts, c: gab, x });
    ok++;
  }
  salvar();
  return { ok, erro };
}

    if (corrigido) mostraResultado();
  };
  const atualizaCrono = () => { const ms = (st.decorrido || 0) + (tick ? Date.now() - t0 : 0); const s = Math.round(ms / 1000); const e = el.querySelector("#crono"); if (e) e.textContent = `⏱ ${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  let ultimo = null;
  const corrigir = () => {
    const g = parseGabarito(st.gab, p.n, p.tipo); const nG = Object.keys(g).length;
    if (nG < p.n * 0.8 && !confirm(`Entendi só ${nG} de ${p.n} respostas no gabarito. Corrigir assim mesmo?`)) { corrigido = null; return; }
    const mapa = parseEstrutura(estr(), p.n); const porArea = {}; let acertos = 0, validas = 0; const erradas = [];
    for (let q = 1; q <= p.n; q++) {
      if (!g[q] || g[q] === "X") continue; validas++;
      const a = mapa[q] || "?"; porArea[a] = porArea[a] || { n: 0, ok: 0 }; porArea[a].n++;
      if (st.resp[q] === g[q]) { acertos++; porArea[a].ok++; } else erradas.push({ q, a, sua: st.resp[q] || "—", cert: g[q] });
    }
    const min = Math.round((st.decorrido || 0) / 60000);
    ultimo = { data: hoje(), acertos, validas, porArea, min, erradas };
    st.tentativas.push({ data: hoje(), acertos, validas, min });
    // alimenta Desempenho/Prontidão por área (sem tópico)
    for (const [a, v] of Object.entries(porArea)) if (AREA[a]) for (let i = 0; i < v.n; i++) S.respostas.push({ id: `${p.id}#${i}`, a, t: "", ok: i < v.ok, data: hoje() });
    if (min) S.sessoes.push({ data: hoje(), min, a: "ce" });
    salvar(); pinta();
  };
  const mostraResultado = () => {
    if (!ultimo) return; const u = ultimo;
    const noEdital = Object.entries(u.porArea).filter(([a]) => AREA[a]);
    const proj = noEdital.length ? AREAS.reduce((s, a) => s + (u.porArea[a.id] ? u.porArea[a.id].ok / u.porArea[a.id].n : 0) * a.q * a.peso, 0) : null;
    const faltando = AREAS.filter(a => !u.porArea[a.id]).map(a => a.nome);
    el.querySelector("#res").innerHTML = `<div class="grid g3" style="margin-top:14px"><div class="stat"><div class="v">${u.acertos}/${u.validas}</div><div class="l">acertos (${pct(u.acertos / u.validas)})</div></div>
      <div class="stat"><div class="v">${proj != null ? proj.toFixed(1) : "—"}</div><div class="l">projeção na escala UFBA (0–90)${faltando.length && proj != null ? " · sem dados de " + faltando.join(", ") : ""}</div></div><div class="stat"><div class="v">${u.min || "—"} min</div><div class="l">tempo registrado</div></div></div>
      <div class="card" style="margin-top:14px"><table><thead><tr><th>Área</th><th class="n">Acertos</th><th class="n">%</th></tr></thead><tbody>${Object.entries(u.porArea).map(([a, v]) => `<tr><td><span class="row" style="gap:6px;display:inline-flex"><span class="area-dot" style="background:${areaInfo(a).cor}"></span>${esc(areaInfo(a).nome)}</span></td><td class="n">${v.ok}/${v.n}</td><td class="n">${pillTaxa(v.ok / v.n)}</td></tr>`).join("")}</tbody></table></div>
      ${u.erradas.length ? `<div class="card"><h2>Questões para revisar (${u.erradas.length})</h2><p class="small muted" style="margin-top:0">Volte a elas na prova comentada. Se quiser que uma entre em Meus erros, copie-a e use o importador em Provas anteriores.</p>
        <div class="row" style="flex-wrap:wrap;gap:6px">${u.erradas.map(e => `<span class="pill pill-bad" title="sua: ${e.sua} · gabarito: ${e.cert}">${e.q}: ${e.sua}→${e.cert}</span>`).join("")}</div></div>` : ""}`;
  };
  limpar = () => { if (tick) { clearInterval(tick); st.decorrido = (st.decorrido || 0) + (Date.now() - t0); salvar(); } };
  pinta();
};

rotear();
</script>
</body>
</html>
