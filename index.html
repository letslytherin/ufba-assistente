<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UFBA Assistente — Preparação</title>
<meta name="theme-color" content="#2f5d8a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
:root{
  --bg:#ffffff;--bg-subtle:#f5f7f9;--surface:#ffffff;--surface-hover:#eef2f6;--border:#e3e8ee;--border-strong:#cfd7e0;
  --text:#1c2733;--text-2:#56636f;--muted:#8793a0;--on-accent:#fff;
  --accent:#2f5d8a;--accent-hover:#264d73;--accent-soft:#e8f0f8;--accent-soft-border:#cddcec;
  --gradient:linear-gradient(135deg,#2f5d8a,#5b8bb8);--shadow-accent:0 6px 16px rgba(47,93,138,.28);
  --danger:#b3413e;--danger-soft:#f7e9e8;--warning:#b8791b;--warning-soft:#faf1e1;--success:#3f7a5c;--success-soft:#e9f3ee;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(28,39,51,.06);--shadow-md:0 4px 12px rgba(28,39,51,.08);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --c-lp:#2f5d8a;--c-inf:#7a5aa6;--c-ap:#b8791b;--c-ce:#3f7a5c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d;--bg-subtle:#171e25;--surface:#1b232b;--surface-hover:#232d37;--border:#2a3540;--border-strong:#3a4652;
  --text:#e6ebf0;--text-2:#a9b4bf;--muted:#7b8793;--accent:#6fa3d6;--accent-hover:#8ab6e0;--accent-soft:#1d2b3a;--accent-soft-border:#2c4259;
  --gradient:linear-gradient(135deg,#3b6c9c,#6fa3d6);--danger:#e07b77;--danger-soft:#3a2221;--warning:#e0a54a;--warning-soft:#382c17;--success:#6fbf92;--success-soft:#1c3226;
  --c-lp:#6fa3d6;--c-inf:#b194d8;--c-ap:#e0a54a;--c-ce:#6fbf92;
}}
:root[data-theme="dark"]{
  --bg:#12171d;--bg-subtle:#171e25;--surface:#1b232b;--surface-hover:#232d37;--border:#2a3540;--border-strong:#3a4652;
  --text:#e6ebf0;--text-2:#a9b4bf;--muted:#7b8793;--accent:#6fa3d6;--accent-hover:#8ab6e0;--accent-soft:#1d2b3a;--accent-soft-border:#2c4259;
  --gradient:linear-gradient(135deg,#3b6c9c,#6fa3d6);--danger:#e07b77;--danger-soft:#3a2221;--warning:#e0a54a;--warning-soft:#382c17;--success:#6fbf92;--success-soft:#1c3226;
  --c-lp:#6fa3d6;--c-inf:#b194d8;--c-ap:#e0a54a;--c-ce:#6fbf92;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-subtle);color:var(--text);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:inherit}
h1{font-size:1.75rem;line-height:1.25;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 8px}
h3{font-size:1.05rem;margin:28px 0 12px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:1.05rem}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--gradient);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:var(--shadow-accent)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.nav-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:14px 10px 6px}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text-2);text-decoration:none;font-size:.9rem;font-weight:500;border:0;background:none;width:100%;cursor:pointer;text-align:left}
.nav-link:hover{background:var(--surface-hover);color:var(--text)}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-link .ic{width:20px;text-align:center;font-size:15px}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
.side-count{margin:0 4px 6px;padding:12px;border-radius:var(--radius-md);background:var(--gradient);color:#fff}
.side-count b{font-size:1.6rem;display:block;line-height:1.1}
.side-count span{font-size:.78rem;opacity:.9}
.topbar{display:none}
.main{padding:32px 32px 96px;min-width:0}
.container{max-width:1040px;margin:0 auto}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.desc{color:var(--text-2);margin:0 0 20px;max-width:720px}
.page-header{margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px}
.stat .v{font-size:1.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--text-2);margin-top:4px}
.hero{background:var(--gradient);color:#fff;border-radius:var(--radius-lg);padding:24px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;box-shadow:var(--shadow-accent)}
.hero .big{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero .sub{opacity:.92;font-size:.92rem}
.hero .units{display:flex;gap:18px}
.hero .units div{text-align:center}
.hero .units b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.hero .units span{font-size:.72rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--radius-sm);padding:9px 16px;font-weight:600;font-size:.9rem;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-ghost{background:none;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-hover)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-soft-border)}
.pill-ok{background:var(--success-soft);color:var(--success);border-color:transparent}
.pill-warn{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.pill-bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill-muted{background:var(--bg-subtle);color:var(--muted);border-color:var(--border)}
.notice{border-radius:var(--radius-md);padding:12px 16px;font-size:.88rem;margin-bottom:18px;background:var(--warning-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warning) 30%,transparent)}
.notice b{color:var(--warning)}
.bar{height:8px;border-radius:99px;background:var(--bg-subtle);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.topic{cursor:default}
.topic label{flex:1;cursor:pointer}
.chk{width:18px;height:18px;accent-color:var(--accent);flex:none}
.area-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
details.disc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden}
details.disc>summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:14px}
details.disc>summary::-webkit-details-marker{display:none}
details.disc .body{padding:0 20px 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.82rem;font-weight:600;color:var(--text-2)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.q-enun{font-size:1.02rem;margin:6px 0 16px;white-space:pre-line}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font-size:.95rem}
.alt:hover{background:var(--surface-hover)}
.alt .letra{font-weight:700;color:var(--accent);flex:none;width:18px}
.alt.sel{border-color:var(--accent);background:var(--accent-soft)}
.alt.ok{border-color:var(--success);background:var(--success-soft)}
.alt.bad{border-color:var(--danger);background:var(--danger-soft)}
.alt[disabled]{cursor:default}
.expl{margin-top:12px;padding:12px 16px;border-radius:var(--radius-md);background:var(--bg-subtle);border-left:3px solid var(--accent);font-size:.92rem}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.15rem;cursor:pointer;padding:28px}
.flash .lado{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 0 18px 28px}
.timeline li:before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:2px;background:var(--border)}
.timeline li:last-child:before{display:none}
.timeline li:after{content:"";position:absolute;left:1px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong)}
.timeline li.passado:after{background:var(--muted);border-color:var(--muted)}
.timeline li.proximo:after{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.timeline li.prova:after{background:var(--danger);border-color:var(--danger)}
.timeline .d{font-size:.8rem;font-weight:700;color:var(--text-2)}
.timeline li.passado .t{color:var(--muted);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.timer{font-size:4.5rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:10px 0}
.plan-item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border)}
.plan-item:last-child{border-bottom:0}
.plan-item .min{flex:none;width:64px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.heat .cell{border-radius:var(--radius-md);padding:12px 14px;border:1px solid var(--border);font-size:.85rem}
.heat .cell b{display:block;font-size:.88rem;margin-bottom:4px}
.c-red{background:var(--danger-soft)}.c-yel{background:var(--warning-soft)}.c-grn{background:var(--success-soft)}.c-none{background:var(--bg-subtle)}
.redacao-area{font-family:"Courier New",monospace;line-height:28px;min-height:560px;background-image:repeating-linear-gradient(var(--surface),var(--surface) 27px,var(--border) 28px);background-attachment:local;padding-top:4px}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.daycard{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;background:var(--bg-subtle);display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.daycard.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.daycard.prova{border-color:var(--danger);background:var(--danger-soft)}
.daycard .blk{background:var(--surface);border-radius:8px;padding:6px 8px}
.daycard .act{color:var(--text-2);text-decoration:none;border-top:1px dashed var(--border);padding-top:6px}
.daycard .act:hover{color:var(--accent)}
.resumo{margin:0;padding-left:20px}.resumo li{margin-bottom:8px}
details.texto{background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;margin:8px 0 4px}
details.texto summary{cursor:pointer;font-weight:600;font-size:.85rem}
details.texto div{white-space:pre-line;margin-top:8px;line-height:1.7}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px;padding:14px 16px}
.sheet-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px}
.sheet-row.ok{background:var(--success-soft)}.sheet-row.bad{background:var(--danger-soft)}.sheet-row.anul{opacity:.55}
.sheet-row .qn{width:26px;text-align:right;font-weight:700;font-size:.85rem;color:var(--text-2);font-variant-numeric:tabular-nums}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-weight:700;font-size:.8rem;cursor:pointer;padding:0}
.bub:hover{border-color:var(--accent)}
.bub.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bub.gab{box-shadow:0 0 0 2px var(--success)}
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty h2{color:var(--text)}
.bottom-nav{display:none}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:var(--surface);padding:8px}
.overlay{display:none}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.chart-bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.chart-bars .b i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent)}
.chart-bars .b span{font-size:.68rem;color:var(--muted);white-space:nowrap}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:50;width:280px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-md)}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .topbar .t{display:flex;align-items:center;gap:8px;font-weight:700}
  .icon-btn{border:0;background:none;font-size:20px;color:var(--text);cursor:pointer;padding:6px 8px;border-radius:8px}
  .main{padding:20px 16px 96px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--text-2);text-decoration:none;padding:4px}
  .bottom-nav a .ic{font-size:18px}
  .bottom-nav a.active{color:var(--accent);font-weight:600}
  .hero .big{font-size:2.8rem}
  .timer{font-size:3.4rem}
}
@media (max-width:420px){.g3,.g4{grid-template-columns:1fr 1fr}.hero .units{gap:12px}}
</style>
</head>

<a class="skip" href="#main">Pular para o conteúdo</a>
<div class="app" id="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar" aria-label="Navegação">
    <div class="brand"><div class="brand-mark">AA</div><div>UFBA Assistente<small>Edital 007/2026 · cargo 201</small></div></div>
    <div class="side-count" id="side-count"></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="nav-link" id="theme-btn"><span class="ic">◐</span><span>Alternar tema</span></button>
      <a class="nav-link" href="#/config"><span class="ic">⚙</span><span>Configurações e backup</span></a>

  <div style="min-width:0">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Abrir menu">☰</button>
      <div class="t"><div class="brand-mark" style="width:28px;height:28px;font-size:12px">AA</div>UFBA Assistente</div>

    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottom-nav" aria-label="Navegação inferior"></nav>

<script>
"use strict";
/* =========================================================================
   DADOS DO EDITAL (Edital de Abertura nº 007/2026 – UFBA / Instituto Avalia)
   ========================================================================= */
const EDITAL = {
  cargo: "201 – Assistente em Administração",
  classe: "Nível Médio – Classe D",
  vagas: { total: 94, ac: 55, pp: 24, pcd: 10, ind: 3, quil: 2 },
  redacaoCorrigida: { ac: 338, pp: 141, pcd: 57, ind: 17, quil: 11 },
  vencimento: 3181.39, auxAlimentacao: 1192.0, taxa: 100,
  banca: "Instituto Avalia", turno: "Manhã", duracao: "4 horas (objetiva + redação)",
  cidades: "Salvador, Vitória da Conquista, Barreiras, Teixeira de Freitas e Juazeiro",
  dataProva: "2026-12-20",
};
const AREAS = [
  { id: "lp",  nome: "Língua Portuguesa",         q: 12, peso: 1, cor: "var(--c-lp)" },
  { id: "inf", nome: "Noções de Informática",     q: 6,  peso: 1, cor: "var(--c-inf)" },
  { id: "ap",  nome: "Administração Pública",     q: 12, peso: 1, cor: "var(--c-ap)" },
  { id: "ce",  nome: "Conhecimentos Específicos", q: 30, peso: 2, cor: "var(--c-ce)" },
];
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const TOTAL_OBJ = AREAS.reduce((s, a) => s + a.q * a.peso, 0); // 90

const DATAS = [
  { ini: "2026-09-28", fim: "2026-09-28", t: "Publicação do Edital de Abertura" },
  { ini: "2026-09-28", fim: "2026-10-02", t: "Impugnação do edital" },
  { ini: "2026-09-28", fim: "2026-10-05", t: "Pedido de isenção da taxa (até 23h59)" },
  { ini: "2026-09-28", fim: "2026-10-06", t: "Upload dos documentos da isenção (até 23h59)" },
  { ini: "2026-10-09", fim: "2026-10-09", t: "Resultado dos pedidos de isenção" },
  { ini: "2026-10-12", fim: "2026-10-13", t: "Recurso contra indeferimento da isenção" },
  { ini: "2026-10-19", fim: "2026-10-19", t: "Resultado da isenção pós-recurso" },
  { ini: "2026-09-28", fim: "2026-10-29", t: "Inscrições (até 23h59 de 29/10)" },
  { ini: "2026-09-28", fim: "2026-10-30", t: "Pagamento da taxa (até 23h) e upload de laudo/documentos de reserva de vagas (até 23h59)" },
  { ini: "2026-11-06", fim: "2026-11-06", t: "Deferimento das inscrições" },
  { ini: "2026-11-09", fim: "2026-11-10", t: "Recurso contra indeferimento da inscrição" },

{a:"lp",t:"Crase",e:"Assinale a alternativa que completa corretamente as lacunas:\n\"Refiro-me ___ servidoras que chegaram ___ pouco tempo ao setor.\"",o:["às – há","as – a","às – a","as – há","à – há"],c:0,x:"\"Referir-se a\" + \"as servidoras\" = às (crase). \"Há pouco tempo\" indica tempo decorrido (verbo haver)."},
{a:"lp",t:"Concordância verbal e nominal",e:"Assinale a frase de acordo com a norma-padrão:",o:["Fazem cinco anos que ingressei na universidade.","Houveram muitos problemas no protocolo.","Faz cinco anos que ingressei na universidade.","Devem haver documentos pendentes.","Existe muitas dúvidas sobre o edital."],c:2,x:"\"Fazer\" indicando tempo decorrido é impessoal (fica no singular). \"Haver\" = existir também é impessoal, e contamina o auxiliar (\"Deve haver\"). \"Existir\" é pessoal: \"Existem muitas dúvidas\"."},
{a:"lp",t:"Regência verbal e nominal",e:"Está correta quanto à regência verbal:",o:["Prefiro mais estudar do que sair.","O servidor assistiu a reunião inteira.","Os candidatos visavam o cargo de assistente.","Obedeça o regimento interno.","Prefiro estudar a sair."],c:4,x:"\"Preferir\" rege a preposição \"a\", sem \"mais\" nem \"do que\". \"Assistir\" (ver) pede \"a\": assistiu à reunião. \"Visar\" (almejar) pede \"a\": visavam ao cargo. \"Obedecer\" pede \"a\": obedeça ao regimento."},
{a:"lp",t:"Pontuação e efeitos de sentido",e:"Assinale a alternativa pontuada corretamente:",o:["Os servidores do setor de protocolo, receberam o novo manual.","Os servidores do setor de protocolo receberam o novo manual.","Os servidores, do setor de protocolo receberam, o novo manual.","Os servidores do setor, de protocolo receberam o novo manual.","Os servidores do setor de protocolo receberam, o novo manual."],c:1,x:"Não se separa por vírgula o sujeito do verbo, nem o verbo de seu complemento."},
{a:"lp",t:"Colocação pronominal",e:"Assinale a opção em que a colocação pronominal segue a norma-padrão:",o:["Nunca disseram-me a verdade.","Me informaram o horário da prova.","Não encontrou-se o processo.","Nunca me disseram a verdade.","Quem avisou-te do prazo?"],c:3,x:"Palavras negativas (nunca, não), pronomes interrogativos (quem) atraem o pronome (próclise). Não se inicia período com pronome oblíquo átono na norma-padrão."},
{a:"lp",t:"Coesão e coerência: referência, conectores, progressão",e:"\"Os prazos foram prorrogados, porquanto houve instabilidade no sistema.\"\nO conectivo destacado expressa ideia de:",o:["concessão","causa/explicação","conclusão","finalidade","condição"],c:1,x:"\"Porquanto\" equivale a \"porque\", \"visto que\" — introduz causa/explicação."},
{a:"lp",t:"Ortografia oficial e acentuação gráfica",e:"De acordo com o Acordo Ortográfico vigente, todas as palavras estão corretamente grafadas em:",o:["idéia – heróico – vôo","ideia – heroico – voo","idéia – heroico – voo","ideia – heróico – vôo","ideia – heroico – vôo"],c:1,x:"Caiu o acento dos ditongos abertos \"ei\" e \"oi\" em paroxítonas (ideia, heroico) e dos hiatos \"oo\"/\"ee\" (voo, leem)."},
{a:"lp",t:"Ortografia oficial e acentuação gráfica",e:"Assinale o uso correto de \"por que / porque / porquê / por quê\":",o:["Não sei porque ele faltou.","Ele faltou por que estava doente.","Não sei por que ele faltou.","Você faltou porque?","Explique o por que da ausência."],c:2,x:"\"Por que\" separado e sem acento em interrogativas indiretas (= por qual motivo). \"Porque\" = explicação; \"por quê\" no fim de frase; \"o porquê\" substantivado."},
{a:"lp",t:"Coordenação, subordinação, vozes verbais e pronomes relativos",e:"Em \"Publicou-se o resultado final\", a estrutura está na voz:",o:["ativa, com sujeito indeterminado","passiva analítica","passiva sintética, com sujeito \"o resultado final\"","reflexiva","ativa, com sujeito oculto"],c:2,x:"Verbo transitivo direto + \"se\" (partícula apassivadora) = passiva sintética. Equivale a \"O resultado final foi publicado\"."},
{a:"lp",t:"Coordenação, subordinação, vozes verbais e pronomes relativos",e:"Assinale a frase com emprego correto do pronome relativo:",o:["O servidor cujo o processo foi arquivado recorreu.","O servidor cujo processo foi arquivado recorreu.","O servidor que o processo foi arquivado recorreu.","O servidor cujo qual processo foi arquivado recorreu.","O servidor onde o processo foi arquivado recorreu."],c:1,x:"\"Cujo\" indica posse e não admite artigo depois dele (\"cujo o\" é erro)."},

/* ---------- Questões extras: estilo AOCP/Avalia (texto-base, situação-problema, "INCORRETA", lei literal) ---------- */
const TXT_ATEND = "Quem chega pela primeira vez ao protocolo de uma universidade raramente sabe o caminho que seu pedido vai percorrer. Embora os sistemas eletrônicos tenham encurtado distâncias, o cidadão ainda depende de alguém que o oriente com paciência e clareza. É nesse ponto que o servidor faz diferença: ao explicar prazos, indicar documentos e acompanhar o andamento do processo, ele transforma uma engrenagem burocrática em serviço público de fato. Muitos processos atrasam não por má vontade, mas porque faltou uma informação simples no início. Por isso, atender bem não é gentileza opcional; é parte da eficiência que a Constituição exige da Administração.\n(Texto elaborado para fins de estudo.)";
Q_SEED.push(
{a:"lp",t:"Compreensão e interpretação de textos",txt:TXT_ATEND,e:"De acordo com o texto, é correto afirmar que",o:["os sistemas eletrônicos eliminaram a necessidade de orientação ao cidadão.","os atrasos nos processos decorrem, principalmente, da má vontade dos servidores.","a orientação clara no atendimento contribui para evitar atrasos nos processos.","o bom atendimento é uma gentileza que o servidor pode oferecer ou não.","o cidadão que chega ao protocolo costuma conhecer o trâmite do seu pedido."],c:2,x:"O texto afirma que muitos processos atrasam “porque faltou uma informação simples no início” — logo, orientar bem previne atrasos. As demais contrariam o texto (a D é o oposto da conclusão)."},
{a:"lp",t:"Coesão e coerência: referência, conectores, progressão",txt:TXT_ATEND,e:"No trecho “Embora os sistemas eletrônicos tenham encurtado distâncias, o cidadão ainda depende de alguém [...]”, a oração introduzida por “Embora” estabelece relação de",o:["causa.","concessão.","conclusão.","finalidade.","condição."],c:1,x:"“Embora” é conjunção concessiva: apresenta um fato que não impede o da oração principal. Equivalentes: ainda que, mesmo que, apesar de que."},
{a:"lp",t:"Coesão e coerência: referência, conectores, progressão",txt:TXT_ATEND,e:"Em “[...] ele transforma uma engrenagem burocrática em serviço público de fato.”, o pronome “ele” retoma",o:["“o cidadão”.","“o protocolo”.","“o servidor”.","“seu pedido”.","“o andamento”."],c:2,x:"Coesão referencial anafórica: “ele” retoma “o servidor”, mencionado logo antes (“É nesse ponto que o servidor faz diferença”)."},
{a:"lp",t:"Reescrita de frases e equivalência de estruturas",txt:TXT_ATEND,e:"A expressão “Por isso”, no último período do texto, poderia ser substituída, sem prejuízo do sentido, por",o:["Contudo,","Embora","Portanto,","Caso","Enquanto isso,"],c:2,x:"“Por isso” introduz conclusão. Equivalentes: portanto, logo, assim, por conseguinte. “Contudo” = oposição; “Embora” = concessão; “Caso” = condição."},
{a:"lp",t:"Tipologia textual e gêneros textuais",txt:TXT_ATEND,e:"Quanto ao modo de organização predominante, o texto é",o:["narrativo.","descritivo.","injuntivo.","dissertativo-argumentativo.","expositivo-instrucional."],c:3,x:"O texto defende uma tese (atender bem é parte da eficiência exigida pela Constituição) e a sustenta com argumentos — dissertação-argumentativa. A AOCP/Avalia costuma cobrar o “modo de organização” do texto-base."},
{a:"lp",t:"Colocação pronominal",txt:TXT_ATEND,e:"Em “alguém que o oriente”, a próclise do pronome “o” justifica-se pela presença de",o:["advérbio de negação.","pronome relativo.","verbo no infinitivo.","conjunção coordenativa.","início de período."],c:1,x:"O pronome relativo “que” é fator de próclise. Outros atratores: palavras negativas, advérbios, pronomes indefinidos e interrogativos, conjunções subordinativas."},
{a:"lp",t:"Semântica: denotação, conotação, sinonímia, paronímia, figuras de linguagem",e:"Assinale a alternativa que completa corretamente as lacunas: “O servidor precisou ______ o erro no ofício, e o reitor ______ a decisão anterior, confirmando-a.”",o:["ratificar – retificou","retificar – ratificou","retificar – retificou","ratificar – ratificou","rectificar – ratificou"],c:1,x:"Parônimos: retificar = corrigir; ratificar = confirmar. Outros clássicos: eminente/iminente, descrição/discrição, infringir/infligir, mandato/mandado, tráfego/tráfico."},
{a:"lp",t:"Semântica: denotação, conotação, sinonímia, paronímia, figuras de linguagem",e:"Em “Nas férias, li todo o Machado de Assis”, ocorre a figura de linguagem denominada",o:["metáfora","hipérbole","metonímia","ironia","antítese"],c:2,x:"Metonímia: troca de um termo por outro com relação de proximidade — aqui, o autor pela obra."},
{a:"lp",t:"Coordenação, subordinação, vozes verbais e pronomes relativos",e:"Assinale a transposição correta da frase “A comissão analisará os recursos” para a voz passiva analítica.",o:["Os recursos analisarão a comissão.","Os recursos serão analisados pela comissão.","Analisar-se-ão os recursos pela comissão.","Os recursos foram analisados pela comissão.","A comissão terá analisado os recursos."],c:1,x:"Na passiva analítica, o auxiliar “ser” fica no mesmo tempo do verbo da ativa (futuro do presente: analisará → serão analisados) e o sujeito vira agente da passiva."},
{a:"lp",t:"Redação Oficial (Manual da Presidência, 3ª ed.)",e:"Assinale a alternativa que preenche corretamente as lacunas, segundo o Manual de Redação da Presidência da República: “Vossa Excelência ______ ciência de que ______ requerimento foi deferido.”",o:["tendes – vosso","tem – seu","tem – vosso","tendes – seu","têm – seus"],c:1,x:"Pronomes de tratamento levam verbo e possessivos na 3ª pessoa: “Vossa Excelência tem… seu requerimento”."},
{a:"lp",t:"Redação Oficial (Manual da Presidência, 3ª ed.)",e:"Segundo o Manual de Redação da Presidência da República (3ª ed.), NÃO é característica da redação oficial:",o:["impessoalidade","clareza e precisão","concisão","uso de linguagem rebuscada e de jargões para demonstrar erudição","formalidade e padronização"],c:3,x:"Os atributos são: clareza e precisão, objetividade, concisão, coesão e coerência, impessoalidade, formalidade e padronização, uso da norma-padrão. Rebuscamento e jargão devem ser evitados."},

{a:"inf",t:"Ameaças: vírus, worms, malware, ransomware",e:"O malware que se propaga automaticamente pelas redes, explorando vulnerabilidades e enviando cópias de si mesmo de computador para computador, sem depender da execução de um arquivo hospedeiro, é o",o:["vírus","worm","cavalo de troia","spyware","adware"],c:1,x:"Worm: autopropagação pela rede. Vírus precisa de um hospedeiro e de execução. Trojan se disfarça de programa legítimo. Spyware coleta informações."},

{a:"ap",t:"Lei 8.112/1990: deveres, proibições, regime disciplinar e PAD",e:"Configura abandono de cargo, na Lei 8.112/1990, a ausência intencional do servidor ao serviço por mais de",o:["15 dias consecutivos","30 dias consecutivos","30 dias interpolados em 12 meses","60 dias consecutivos","60 dias interpolados em 6 meses"],c:1,x:"Art. 138: abandono = mais de 30 dias consecutivos. Inassiduidade habitual (art. 139) = 60 dias interpolados em 12 meses, sem causa justificada."},
{a:"ap",t:"Processo administrativo federal (Lei 9.784/1999)",e:"Conforme a Lei 9.784/1999, NÃO pode ser objeto de delegação:",o:["a instrução do processo","a decisão de recursos administrativos","a intimação dos interessados","a emissão de pareceres","o atendimento ao público"],c:1,x:"Art. 13: não se delegam a edição de atos normativos, a decisão de recursos e as matérias de competência exclusiva (mnemônico CE-NO-RE)."},
{a:"ap",t:"LAI (Lei 12.527/2011 e Decreto 7.724/2012)",e:"Na Lei de Acesso à Informação, o prazo máximo de restrição de acesso à informação classificada como ultrassecreta é de",o:["5 anos","15 anos","25 anos","50 anos","100 anos"],c:2,x:"Art. 24: ultrassecreta 25, secreta 15, reservada 5 anos. Informações pessoais: até 100 anos (art. 31)."},
{a:"ap",t:"LGPD (Lei 13.709/2018) na Administração Pública",e:"Na LGPD, a pessoa indicada pelo controlador e pelo operador para atuar como canal de comunicação entre o controlador, os titulares dos dados e a ANPD é o",o:["operador","encarregado","titular","controlador","auditor"],c:1,x:"Art. 5º, VIII: encarregado (DPO). Controlador toma as decisões; operador trata os dados em nome do controlador; titular é a pessoa a quem os dados se referem."},
{a:"ap",t:"Improbidade administrativa (Lei 8.429/1992 e alterações)",e:"Após a Lei 14.230/2021, a ação para aplicação das sanções por improbidade prescreve em",o:["5 anos","8 anos","10 anos","12 anos","nunca prescreve"],c:1,x:"Art. 23: 8 anos, contados da ocorrência do fato (ou do dia em que cessou a permanência, nas infrações permanentes)."},
{a:"ap",t:"Governança, integridade, controle e Decreto 9.830/2019",e:"De acordo com o Decreto 9.830/2019, que regulamenta a LINDB, o agente público responde pessoalmente por suas decisões ou opiniões técnicas em caso de",o:["qualquer erro","culpa leve","dolo ou erro grosseiro","divergência com o superior","decisão revogada"],c:2,x:"Art. 12: responsabilização por dolo (direto ou eventual) ou erro grosseiro — culpa grave, com negligência, imprudência ou imperícia graves."},
{a:"ap",t:"Atendimento ao público e Carta de Serviços ao Usuário",e:"Segundo a Lei 13.460/2017, a ouvidoria deve apresentar decisão final sobre a manifestação do usuário no prazo de",o:["10 dias, prorrogável por 10","20 dias, prorrogável por 10","30 dias, prorrogável uma vez por igual período","45 dias, improrrogável","60 dias"],c:2,x:"Art. 16: 30 dias, prorrogável uma vez por igual período, mediante justificativa. A Carta de Serviços ao Usuário está no art. 7º."},
{a:"ap",t:"Sustentabilidade e A3P",e:"NÃO é eixo temático da Agenda Ambiental na Administração Pública (A3P):",o:["uso racional dos recursos naturais e bens públicos","gestão adequada dos resíduos gerados","qualidade de vida no ambiente de trabalho","contratações públicas sustentáveis","privatização de serviços ambientais"],c:4,x:"Eixos da A3P: uso racional dos recursos, gestão de resíduos, qualidade de vida no trabalho, sensibilização e capacitação, contratações sustentáveis e construções sustentáveis."},
{a:"ap",t:"IFES: estrutura, autonomia universitária e colegiados",e:"Segundo o art. 207 da CF/88, as universidades gozam de autonomia didático-científica, administrativa e de gestão financeira e patrimonial, e obedecerão ao princípio da",o:["gratuidade do ensino superior privado","indissociabilidade entre ensino, pesquisa e extensão","exclusividade do ensino presencial","centralização administrativa","vitaliciedade dos reitores"],c:1,x:"Art. 207: autonomia + indissociabilidade entre ensino, pesquisa e extensão. Pilar básico para as questões sobre IFES e sobre o Estatuto da UFBA."},
{a:"ce",t:"Organização administrativa da União: direta e indireta",e:"A entidade dotada de personalidade jurídica de direito privado, com capital integralmente público, criada mediante autorização legal e que pode adotar qualquer forma societária, é a",o:["autarquia","fundação pública de direito público","empresa pública","sociedade de economia mista","agência reguladora"],c:2,x:"Empresa pública: capital 100% público, qualquer forma societária. Sociedade de economia mista: sempre S.A., maioria das ações com direito a voto em poder do Estado."},
{a:"ce",t:"Agentes públicos: espécies, cargo, emprego e função",e:"O cidadão convocado para atuar como mesário nas eleições é classificado, pela doutrina, como",o:["agente político","servidor estatutário","empregado público","particular em colaboração com o Poder Público","agente militar"],c:3,x:"Particulares em colaboração: mesários, jurados, conscritos (requisitados), além de delegados como tabeliães e concessionários."},
{a:"ce",t:"Poderes administrativos e uso/abuso do poder",e:"São atributos do poder de polícia:",o:["hierarquia, disciplina e subordinação","discricionariedade, autoexecutoriedade e coercibilidade","imperatividade, vitaliciedade e inamovibilidade","gratuidade, universalidade e continuidade","legalidade, publicidade e eficiência"],c:1,x:"Poder de polícia: discricionariedade (em regra), autoexecutoriedade e coercibilidade. Ciclo: ordem, consentimento, fiscalização e sanção."},
{a:"ce",t:"Serviços públicos e delegação (concessão, permissão, autorização)",e:"Serviços prestados a toda a coletividade, sem usuários determinados, como a iluminação pública, são classificados como",o:["uti singuli","uti universi","impróprios","delegados","industriais"],c:1,x:"Uti universi = gerais, indivisíveis, custeados por impostos. Uti singuli = individuais, mensuráveis, podem ser remunerados por taxa ou tarifa (ex.: água, energia)."},
{a:"ce",t:"Organizações formais: estrutura e departamentalização",e:"A estrutura organizacional caracterizada pela dupla subordinação — o empregado responde ao gerente funcional e ao gerente de projeto — é a",o:["linear","funcional","linha-staff","matricial","divisional"],c:3,x:"Matricial combina departamentalização funcional com a por projetos/produtos, gerando dupla autoridade. Linear: unidade de comando (Fayol)."},
{a:"ce",t:"Processo organizacional: planejamento, direção, comunicação, controle",e:"Henry Mintzberg concluiu que os gerentes desempenham dez papéis, agrupados nas categorias",o:["técnicos, humanos e conceituais","interpessoais, informacionais e decisórios","estratégicos, táticos e operacionais","planejamento, organização e controle","formais, informais e mistos"],c:1,x:"Interpessoais (figura de proa, líder, ligação), informacionais (monitor, disseminador, porta-voz), decisórios (empreendedor, solucionador de distúrbios, alocador de recursos, negociador). Caiu na AOCP IF-MA 2023. Katz é quem fala de habilidades técnicas, humanas e conceituais."},
{a:"ce",t:"Processo organizacional: planejamento, direção, comunicação, controle",e:"Quanto ao grau de familiaridade da organização com a situação, as decisões classificam-se em",o:["programadas e não programadas","otimizadas e não otimizadas","estratégicas e operacionais","individuais e coletivas","centralizadas e descentralizadas"],c:0,x:"Herbert Simon: decisões programadas (rotineiras, com regras) e não programadas (novas, sem estrutura). Caiu na AOCP IF-MA 2023."},
{a:"ce",t:"Processo organizacional: planejamento, direção, comunicação, controle",e:"Na análise SWOT, oportunidades e ameaças referem-se",o:["ao ambiente interno da organização","ao ambiente externo da organização","apenas aos concorrentes diretos","aos recursos financeiros disponíveis","às competências dos servidores"],c:1,x:"Forças e fraquezas = ambiente interno (controláveis). Oportunidades e ameaças = ambiente externo."},
{a:"ce",t:"Gestão da qualidade",e:"No ciclo PDCA, a etapa em que se comparam os resultados obtidos com as metas planejadas é a",o:["Plan","Do","Check","Act","Control"],c:2,x:"Plan (planejar), Do (executar), Check (verificar/checar), Act (agir corretivamente e padronizar)."},
{a:"ce",t:"Gestão da qualidade",e:"No programa 5S, o senso de utilização (Seiri) consiste em",o:["limpar o ambiente de trabalho","separar o necessário do desnecessário, descartando o que não é útil","organizar os itens para fácil localização","padronizar e manter a saúde","desenvolver a autodisciplina"],c:1,x:"Seiri = utilização/descarte; Seiton = ordenação; Seisō = limpeza; Seiketsu = saúde/padronização; Shitsuke = autodisciplina."},
{a:"ce",t:"Gestão da qualidade",e:"A ferramenta da qualidade que organiza as possíveis causas de um problema em categorias como método, máquina, mão de obra, material, meio ambiente e medida é o",o:["gráfico de Pareto","diagrama de Ishikawa","histograma","5W2H","fluxograma"],c:1,x:"Ishikawa (espinha de peixe, causa e efeito) usa os 6M. Pareto prioriza as poucas causas vitais (80/20). 5W2H é plano de ação."},
{a:"ce",t:"Gestão de projetos",e:"Projeto é um esforço",o:["contínuo e repetitivo para manter as operações","temporário empreendido para criar um produto, serviço ou resultado único","permanente de controle orçamentário","exclusivo da alta administração","sem prazo definido de término"],c:1,x:"Definição do PMBOK. Projetos têm início e fim definidos; operações são contínuas. Restrição tripla: escopo, prazo e custo."},
{a:"ce",t:"Gestão de pessoas: conceitos e função do órgão de GP",e:"É vantagem do recrutamento interno em relação ao externo:",o:["trazer novas ideias e experiências","renovar a cultura organizacional","ser mais rápido e econômico, além de motivar os funcionários","ampliar o capital intelectual com pessoas de fora","evitar totalmente conflitos internos"],c:2,x:"Interno: mais rápido, barato, motiva e aproveita quem já está adaptado. Externo: oxigena a organização, traz novas competências."},
{a:"ce",t:"Comportamento organizacional: motivação e liderança",e:"Na liderança situacional de Hersey e Blanchard, diante de liderados com alta competência e alto comprometimento, o estilo indicado é",o:["determinar","persuadir","compartilhar","delegar","autocrático"],c:3,x:"Maturidade baixa → determinar; baixa/moderada → persuadir; moderada/alta → compartilhar; alta → delegar."},
{a:"ce",t:"Comportamento organizacional: motivação e liderança",e:"O estilo de liderança em que o líder concede total liberdade ao grupo, participando minimamente das decisões, é o",o:["autocrático","democrático","liberal (laissez-faire)","situacional","transformacional"],c:2,x:"Autocrático: o líder decide sozinho. Democrático: decisões discutidas com o grupo. Liberal: liberdade total, líder pouco atuante."},
{a:"ce",t:"Recursos materiais: classificação e gestão de estoques",e:"Como responsável pelo almoxarifado da UFBA, você registra consumo médio de 10 resmas de papel por dia, tempo de reposição de 5 dias e estoque de segurança de 20 resmas. O ponto de pedido é de",o:["30 resmas","50 resmas","70 resmas","100 resmas","150 resmas"],c:2,x:"PP = consumo médio × tempo de reposição + estoque de segurança = 10 × 5 + 20 = 70. Enunciado em situação-problema, como a AOCP/Avalia costuma fazer."},
{a:"ce",t:"Recursos materiais: classificação e gestão de estoques",e:"O indicador que mostra quantas vezes o estoque se renovou em determinado período é o",o:["cobertura de estoque","giro de estoque","ponto de pedido","lote econômico","nível de serviço"],c:1,x:"Giro = consumo (ou saídas) no período ÷ estoque médio. Cobertura = por quanto tempo o estoque atende ao consumo. Caiu na AOCP IF-MA 2023."},
{a:"ce",t:"Recursos materiais: classificação e gestão de estoques",e:"Na classificação XYZ, os materiais da classe Z são aqueles",o:["de baixo valor de consumo","de baixa criticidade, facilmente substituíveis","de máxima criticidade, imprescindíveis e sem substituto","de consumo irregular","obsoletos"],c:2,x:"XYZ mede a criticidade: X baixa, Y média, Z máxima (a falta paralisa atividades). ABC mede o valor de consumo."},
{a:"ce",t:"Recebimento, conferência e armazenagem",e:"No recebimento de materiais, a etapa em que se verifica se a nota fiscal corresponde ao pedido de compra (fornecedor, quantidades, preços) é a",o:["armazenagem","conferência documental (entrada)","conferência qualitativa","distribuição","inventário"],c:1,x:"Sequência típica: entrada/conferência documental → conferência quantitativa → conferência qualitativa → regularização (aceite ou recusa) → armazenagem."},
{a:"ce",t:"Arquivologia: conceitos e gestão de documentos",e:"Segundo a Lei 8.159/1991, a gestão de documentos compreende o conjunto de procedimentos e operações técnicas referentes à",o:["leitura, interpretação, guarda e descarte","produção, tramitação, uso, avaliação e arquivamento","representação, formação e destinação","digitalização e microfilmagem","restauração e difusão cultural"],c:1,x:"Art. 3º da Lei 8.159/1991: produção, tramitação, uso, avaliação e arquivamento em fase corrente e intermediária, visando à eliminação ou ao recolhimento. Caiu na AOCP IF-MA 2023."},
{a:"ce",t:"Arquivologia: conceitos e gestão de documentos",e:"O princípio arquivístico segundo o qual os documentos de uma mesma entidade produtora não devem ser misturados aos de outras é o da",o:["organicidade","proveniência (respeito aos fundos)","unicidade","indivisibilidade","cumulatividade"],c:1,x:"Proveniência: respeitar a origem do fundo. Organicidade: os documentos refletem as funções do órgão. Unicidade: cada documento é único em seu contexto."},
{a:"ce",t:"Arquivos correntes, intermediários e permanentes",e:"A passagem dos documentos do arquivo intermediário para o arquivo permanente denomina-se",o:["transferência","recolhimento","eliminação","avaliação","remessa"],c:1,x:"Transferência: corrente → intermediário. Recolhimento: → permanente."},
{a:"ce",t:"Tipologias, suportes, microfilmagem e automação",e:"“Ata de reunião do Conselho Universitário” é exemplo de",o:["gênero documental","espécie documental","tipo documental","suporte documental","formato documental"],c:2,x:"Espécie = forma do documento (ata). Tipo = espécie + atividade que o gerou (ata de reunião do Conselho). Gênero = textual, iconográfico, audiovisual etc."},
{a:"ce",t:"Preservação, conservação e restauração",e:"É medida de conservação preventiva em arquivos:",o:["usar clipes metálicos e fita adesiva para organizar os documentos","manter temperatura e umidade relativa estáveis e controladas","expor os documentos à luz solar para evitar fungos","plastificar documentos históricos","guardar os documentos no chão para facilitar o acesso"],c:1,x:"Controlar temperatura, umidade, luz, poeira e pragas; evitar metais, adesivos e plastificação. Restauração é a intervenção direta no documento já danificado."},
{a:"ce",t:"Trabalho em equipe, relações interpessoais e comunicação",e:"Na Janela de Johari, a área que reúne aspectos conhecidos pelos outros, mas desconhecidos pela própria pessoa, é a área",o:["aberta","cega","oculta","desconhecida","pública"],c:1,x:"Aberta: conhecida por todos. Cega: só os outros veem (reduz-se com feedback). Oculta: só eu sei. Desconhecida: ninguém sabe."},
{a:"ce",t:"Trabalho em equipe, relações interpessoais e comunicação",e:"No processo de comunicação, qualquer interferência que distorça ou prejudique a mensagem entre emissor e receptor é denominada",o:["código","canal","ruído","feedback","repertório"],c:2,x:"Elementos: emissor, mensagem, código, canal, receptor, feedback e ruído. O feedback permite verificar se a mensagem foi compreendida."},
{a:"ce",t:"Atendimento ao público: qualidade e postura",e:"Um servidor que guarda reserva sobre informações pessoais do usuário atendido demonstra, no atendimento, a qualidade da",o:["presteza","discrição","objetividade","tolerância","comunicabilidade"],c:1,x:"Qualidades do edital: comunicabilidade, apresentação, atenção, cortesia, interesse, presteza, eficiência, tolerância, discrição, conduta e objetividade."},
{a:"ce",t:"Controle da Administração e responsabilidade civil do Estado",e:"O controle externo da Administração Pública Federal é exercido pelo Congresso Nacional com o auxílio do",o:["Ministério Público","Tribunal de Contas da União","Supremo Tribunal Federal","Controladoria-Geral da União","Advocacia-Geral da União"],c:1,x:"CF, arts. 70 e 71. A CGU faz controle INTERNO do Executivo federal."},
);
